<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070811">
<title>波纹原型 · echo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #070811; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: fixed; inset: 0; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }

  /* 场景 + 角色 */
  .scene {
    position: absolute; inset: 0;
  }
  .scene .bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none; display: block;
  }
  .scene .character {
    position: absolute;
    bottom: 26vh; left: 50%;
    width: 56vw; max-width: 320px;
    transform: translateX(-50%);
    pointer-events: none;
    filter: drop-shadow(0 6px 20px rgba(0,0,0,0.5));
  }

  /* 场景副本：被水波 filter 折射，且只通过 mask 在一条波带上可见 —— 波带上行 = 水波从下到上扩散 */
  .scene-distort {
    filter: url(#water-distort);
    -webkit-mask-image: linear-gradient(to top, transparent 0%, transparent 100%);
    mask-image: linear-gradient(to top, transparent 0%, transparent 100%);
    pointer-events: none;
    visibility: hidden;
    will-change: mask-image;
  }
  .scene-distort.active { visibility: visible; }

  /* 水波环层（屏底中心同心圆 — 仅作为波峰上的轻微高光） */
  .water-rings {
    position: absolute; inset: 0;
    pointer-events: none; overflow: hidden;
  }
  .water-ring {
    position: absolute;
    left: 50%; top: 100%;
    width: 0; height: 0;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(255, 250, 240, 0.30);
    pointer-events: none;
    mix-blend-mode: screen;
    filter: blur(0.6px);
    will-change: width, height, opacity;
  }

  /* 声波层 —— 容器全屏；base 用小区域子定位做压缩爆发，pulse 占满全屏靠 path 位移扩散 */
  .sound-zone {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .sound-svg {
    position: absolute;
    overflow: visible;
    will-change: opacity;
  }
  .sound-svg.base {
    left: 0; right: 0;
    bottom: 12vh;
    width: 100%; height: 14vh;
    transform-origin: 50% 100%;
    will-change: transform, opacity;
  }
  .sound-svg.pulse {
    inset: 0;
    width: 100%; height: 100%;
  }
  .sound-svg .stroke {
    fill: none;
    stroke: rgba(255, 235, 210, 0.85);
    stroke-width: 3;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .sound-svg.pulse {
    filter: url(#sound-irregular);
  }
  .sound-svg.pulse .stroke {
    stroke: rgba(255, 235, 210, 0.9);
    stroke-width: 2.5;
  }

  /* 抵达闪屏 —— 屏幕边缘微微一亮（vignette 反向） */
  .edge-flash {
    position: absolute; inset: 0;
    box-shadow:
      inset 0 0 90px 8px rgba(255, 235, 210, 0.55),
      inset 0 0 28px 0 rgba(255, 240, 220, 0.35);
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    will-change: opacity;
  }

  .defs-only {
    position: absolute; width: 0; height: 0;
    overflow: hidden; pointer-events: none;
  }

  .controls {
    position: absolute;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 12px;
    z-index: 100;
  }
  .controls button {
    padding: 12px 22px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .controls button:active { transform: scale(0.95); }
  .controls button[disabled] { opacity: 0.4; cursor: default; }

  .label {
    position: absolute;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.85);
    font-size: 12px;
    pointer-events: none;
    background: rgba(0, 0, 0, 0.45);
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="scene" id="scene">
      <img class="bg" src="../src/images/cj1.jpg" alt="">
      <img class="character" src="../src/images/xiaohuli.png" alt="">
    </div>

    <div class="scene scene-distort" id="scene-distort">
      <img class="bg" src="../src/images/cj1.jpg" alt="">
      <img class="character" src="../src/images/xiaohuli.png" alt="">
    </div>

    <div class="water-rings" id="water-rings"></div>

    <div class="sound-zone">
      <svg class="sound-svg base" id="sound-base" viewBox="0 0 1000 220" preserveAspectRatio="none" style="opacity:0">
        <path class="stroke" d="M 60 200 Q 500 20 940 200"/>
      </svg>
      <svg class="sound-svg pulse" id="sound-pulse-1" viewBox="0 0 100 100" preserveAspectRatio="none" style="opacity:0">
        <circle class="stroke" cx="50" cy="165" r="90"/>
      </svg>
      <svg class="sound-svg pulse" id="sound-pulse-2" viewBox="0 0 100 100" preserveAspectRatio="none" style="opacity:0">
        <circle class="stroke" cx="50" cy="165" r="90"/>
      </svg>
    </div>

    <div class="edge-flash" id="edge-flash"></div>

    <div class="label" id="label">水波（上滑切换）/ 声波（松手传送）</div>

    <div class="controls">
      <button id="btn-water">水波</button>
      <button id="btn-sound">声波</button>
      <button id="btn-both">水→声</button>
    </div>

    <svg class="defs-only">
      <defs>
        <!-- 水波折射：低频 noise + Gaussian blur 平滑 = 纯弧形平滑过渡 -->
        <filter id="water-distort" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="1" seed="3" id="water-turb"/>
          <feGaussianBlur stdDeviation="2.5" result="smoothNoise"/>
          <feDisplacementMap in="SourceGraphic" in2="smoothNoise" scale="0" id="water-disp"/>
        </filter>

        <!-- 水波环边缘轻微抖动（弱化） -->
        <filter id="ring-irregular" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="1" seed="7"/>
          <feDisplacementMap in="SourceGraphic" scale="3"/>
        </filter>

        <!-- 声波脉冲不规则边缘 —— pulse 现在 viewBox 100×100，频率/位移按 vw 单位重新校准 -->
        <filter id="sound-irregular" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="1" seed="11" id="sound-turb"/>
          <feDisplacementMap in="SourceGraphic" scale="0.5"/>
        </filter>
      </defs>
    </svg>
  </div>

<script>
const scene        = document.getElementById('scene');
const sceneDistort = document.getElementById('scene-distort');
const waterRings   = document.getElementById('water-rings');
const waterDisp    = document.getElementById('water-disp');
const waterTurb    = document.getElementById('water-turb');
const soundBase   = document.getElementById('sound-base');
const soundPulse1 = document.getElementById('sound-pulse-1');
const soundPulse2 = document.getElementById('sound-pulse-2');
const soundPulse1Circle = soundPulse1.querySelector('circle');
const soundPulse2Circle = soundPulse2.querySelector('circle');
const PULSE_REST_R = '90';
const soundTurb   = document.getElementById('sound-turb');
const edgeFlash   = document.getElementById('edge-flash');
const btnWater    = document.getElementById('btn-water');
const btnSound    = document.getElementById('btn-sound');
const btnBoth     = document.getElementById('btn-both');
const label       = document.getElementById('label');

const easeOut       = t => 1 - Math.pow(1 - t, 3);
const easeOutQ      = t => 1 - Math.pow(1 - t, 4);
const easeInOutSine = t => 0.5 - 0.5 * Math.cos(t * Math.PI);

function tween(duration, onTick) {
  return new Promise(resolve => {
    const start = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - start) / duration);
      onTick(t);
      if (t < 1) requestAnimationFrame(step);
      else resolve();
    };
    requestAnimationFrame(step);
  });
}

function setBusy(on) {
  btnWater.disabled = on;
  btnSound.disabled = on;
  btnBoth.disabled  = on;
}

/* ---- 水波：折射波带从下到上行（缓、匀、波过即静） ---- */
function setBand(centerPct, halfWidth, fade) {
  const bot = centerPct - halfWidth;
  const top = centerPct + halfWidth;
  const fb  = bot - fade;
  const ft  = top + fade;
  const grad = `linear-gradient(to top,
    transparent ${fb}%,
    black ${bot}%,
    black ${top}%,
    transparent ${ft}%)`;
  sceneDistort.style.maskImage = grad;
  sceneDistort.style.webkitMaskImage = grad;
}

async function playWater() {
  label.textContent = '水波 · 折射波带上行（上滑切换）';

  // 准备波带（初始整个 mask 都在屏外）
  setBand(-40, 16, 12);
  sceneDistort.classList.add('active');

  waterRings.innerHTML = '';
  const ringDelays = [0, 380, 760, 1140];   // 四条紧排，形成连续波列
  const rings = ringDelays.map(() => {
    const r = document.createElement('div');
    r.className = 'water-ring';
    waterRings.appendChild(r);
    return r;
  });

  const totalDur     = 3000;     // 缓
  const startCenter  = -25;      // 波带中心从屏外底（-25%）
  const endCenter    = 125;      // 上行到屏外顶（125%）
  const bandHalf     = 16;       // 波带半宽 16% → 总带宽 32%
  const bandFade     = 14;       // 边缘羽化 14%
  const ringMax      = Math.max(window.innerWidth, window.innerHeight) * 2.2;

  await tween(totalDur, (t) => {
    const eased = easeInOutSine(t);

    // 波带匀速上行（中心位置以 ease-in-out 过渡，避免起停生硬）
    const center = startCenter + (endCenter - startCenter) * eased;
    setBand(center, bandHalf, bandFade);

    // 折射强度：bell 曲线（起手弱 → 中段最强 → 尾段渐弱）
    const bell = Math.sin(t * Math.PI);
    const disp = 6 + bell * 18;   // 6 → 24 → 6
    waterDisp.setAttribute('scale', disp.toFixed(2));

    // seed 不再动画 —— 完全静态，靠波带上行 + scale bell 取得"波在传播"的感觉，避免任何跳变

    // 两条环作为波峰高光，跟随波带前缘缓慢扩张
    rings.forEach((ring, i) => {
      const delay = ringDelays[i] / totalDur;
      const span  = 1 - delay;
      const lt    = Math.max(0, Math.min(1, (t - delay) / span));
      if (lt <= 0) { ring.style.opacity = '0'; return; }
      const e    = easeOut(lt);
      const size = e * ringMax;
      ring.style.width  = size + 'px';
      ring.style.height = size + 'px';
      // 渐入快、渐出慢，整体偏淡（mix-blend-mode: screen 已经会再加一层亮）
      let op;
      if (lt < 0.20)      op = (lt / 0.20) * 0.28;
      else if (lt < 0.65) op = 0.28;
      else                op = ((1 - lt) / 0.35) * 0.28;
      ring.style.opacity = Math.max(0, op).toFixed(3);
    });
  });

  sceneDistort.classList.remove('active');
  setBand(-40, 16, 12);
  waterRings.innerHTML = '';
  label.textContent = '水波（上滑切换）/ 声波（松手传送）';
}

/* ---- 声波：压缩爆发 + 不规则脉冲 + 抵达闪屏（急、碎、有闪） ---- */
async function playSound() {
  label.textContent = '声波 · 压缩爆发 → 不规则脉冲 → 抵达闪屏';

  soundBase.style.opacity = '0';
  soundPulse1.style.opacity = '0';
  soundPulse2.style.opacity = '0';
  edgeFlash.style.opacity = '0';

  const totalDur = 1700;
  // 阶段（ms）
  //  0– 90  base 出现
  //  90–230 压缩（scaleY 1→0.55）
  // 230–360 爆开（scaleY 0.55→1.4，base 渐隐）
  // 280–1400 脉冲 1 上行扩张
  // 460–1500 脉冲 2 上行扩张
  // 1250–1650 抵达闪屏

  await tween(totalDur, (raw) => {
    const t = raw * totalDur;

    // 声波 turbulence 缓慢切换（淡淡不规则，避免漫画感）
    soundTurb.setAttribute('seed', String(11 + Math.floor(raw * 4)));

    // base 出现
    if (t < 90) {
      soundBase.style.opacity = (t / 90).toFixed(3);
      soundBase.style.transform = 'scaleY(1) scaleX(1)';
    }
    // 压缩
    else if (t < 230) {
      const lt = (t - 90) / 140;
      const sy = 1 - lt * 0.45;
      const sx = 1 - lt * 0.04;
      soundBase.style.opacity = '1';
      soundBase.style.transform = `scaleY(${sy}) scaleX(${sx})`;
    }
    // 爆开
    else if (t < 360) {
      const lt = (t - 230) / 130;
      const sy = 0.55 + easeOut(lt) * 0.85;
      const sx = 0.96 + lt * 0.04;
      soundBase.style.transform = `scaleY(${sy}) scaleX(${sx})`;
      soundBase.style.opacity = (1 - lt * 0.7).toFixed(3);
    }
    // base 残影衰减
    else {
      const lt = Math.min(1, (t - 360) / 260);
      soundBase.style.opacity = ((1 - lt) * 0.3).toFixed(3);
    }

    // 脉冲 1：同心圆扩张 —— 圆心固定在 (50, 165)（屏底再下 65vh），半径 r 单调增长
    // r=90: 圆顶在屏内 75vh，与 base 弧位置对齐；r=170: 圆顶高出屏顶 5vh，左右两脚也已出屏
    const p1s = 280, p1e = 1400;
    if (t >= p1s && t <= p1e) {
      const lt = (t - p1s) / (p1e - p1s);
      const e  = easeOutQ(lt);
      const r  = 90 + e * 80;                 // 90 → 170
      soundPulse1Circle.setAttribute('r', r.toFixed(2));
      const op = lt < 0.80 ? 0.78 : 0.78 * (1 - (lt - 0.80) / 0.20);
      soundPulse1.style.opacity = Math.max(0, op).toFixed(3);
    } else if (t > p1e) {
      soundPulse1.style.opacity = '0';
    }

    // 脉冲 2：滞后启动、终态半径稍小（圆顶刚到屏顶），叠加层次
    const p2s = 460, p2e = 1500;
    if (t >= p2s && t <= p2e) {
      const lt = (t - p2s) / (p2e - p2s);
      const e  = easeOutQ(lt);
      const r  = 90 + e * 70;                 // 90 → 160
      soundPulse2Circle.setAttribute('r', r.toFixed(2));
      const op = lt < 0.80 ? 0.55 : 0.55 * (1 - (lt - 0.80) / 0.20);
      soundPulse2.style.opacity = Math.max(0, op).toFixed(3);
    } else if (t > p2e) {
      soundPulse2.style.opacity = '0';
    }

    // 抵达闪屏 —— 屏幕边缘微微一闪
    if (t >= 1250 && t <= 1650) {
      const lt = (t - 1250) / 400;
      const op = lt < 0.30 ? (lt / 0.30) * 0.55 : ((1 - lt) / 0.70) * 0.55;
      edgeFlash.style.opacity = Math.max(0, op).toFixed(3);
    } else {
      edgeFlash.style.opacity = '0';
    }
  });

  soundBase.style.opacity = '0';
  soundBase.style.transform = '';
  soundPulse1.style.opacity = '0';
  soundPulse2.style.opacity = '0';
  soundPulse1Circle.setAttribute('r', PULSE_REST_R);
  soundPulse2Circle.setAttribute('r', PULSE_REST_R);
  edgeFlash.style.opacity = '0';
  label.textContent = '水波（上滑切换）/ 声波（松手传送）';
}

async function run(fn) {
  setBusy(true);
  try { await fn(); } finally { setBusy(false); }
}

btnWater.addEventListener('click', () => run(playWater));
btnSound.addEventListener('click', () => run(playSound));
btnBoth.addEventListener('click', () => run(async () => {
  await playWater();
  await new Promise(r => setTimeout(r, 250));
  await playSound();
}));
</script>
</body>
</html>
