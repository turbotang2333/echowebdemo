// anchorEverClicked: 用户是否点过左上角锚点；点过一次后整局不再触发提示动画
let anchorEverClicked = false;
function pulseHistoryAnchor() {
  if (anchorEverClicked) return;
  if (mode !== 'text') return;
  // 移除再加，强制重置 animation；中间用 reflow 确保浏览器重新拾起
  historyAnchor.classList.remove('hint-pulse');
  void historyAnchor.offsetWidth;
  historyAnchor.classList.add('hint-pulse');
}
historyAnchor.addEventListener('animationend', (e) => {
  if (e.animationName === 'anchorHintPulse') historyAnchor.classList.remove('hint-pulse');
});

// 左上角锚点：切换历史面板
historyAnchor.addEventListener('click', (e) => {
  e.stopPropagation();
  anchorEverClicked = true;
  historyAnchor.classList.remove('hint-pulse');
  if (state === 'history-enter') { interruptToClose(); return; }
  if (state === 'history-exit')  { interruptToOpen(); return; }
  const panelVisible = state === 'history-idle';
  if (panelVisible) {
    closeHistoryWithAnim();
  } else if (mode === 'history') {
    enterHistory();
  } else {
    openOverlay();
  }
});

// 点击面板外区域收起
document.getElementById('stage').addEventListener('click', (e) => {
  if (mode.startsWith('login')) return;
  // Android Chrome 兜底：短按弧底后 pointerup 阶段 focus() 没弹起键盘的情况下，
  // click 事件比 pointerup 在 Android 上更"重"，再补一次 focus() 通常能把键盘叫出来。
  if ((state === 'arc-typing-enter' || state === 'arc-typing')
      && !e.target.closest('.typing-input') && !e.target.closest('.typing-send')) {
    if (document.activeElement !== typingInput) {
      try { typingInput.focus(); } catch (_) {}
    }
    return;
  }
  if (e.target.closest('.history-anchor')) return;
  if (state === 'history-enter') {
    if (e.target.closest('.history-panel')) return;
    interruptToClose(); return;
  }
  if (state === 'history-exit') return;
  const historyShowing = mode === 'history' || historyOverlay;
  if (!historyShowing) return;
  if (e.target.closest('.history-panel')) return;
  closeHistoryWithAnim();
});

// ============================================================
// 文字层 ⑨ — 机制移植自根目录 js/paragraph.js（暖白语言 + 去控件化）
// ============================================================
const narrationZone = document.getElementById('narration-zone');
const bubbleZone = document.getElementById('bubble-zone');

const TYPING_DIALOGUE = 55;     // 气泡逐字 ms/字
const TOKEN_CHUNK_GAP = 240;    // 旁白相邻 chunk 启动间隔
const TOKEN_CHUNK_JITTER = 0.2;
const TOKEN_LINE_PAUSE = 180;
const TOKEN_FADE_MS = 700;

const TRAILING_PUNCT = new Set(["。","，","、","；","：","？","！","…","“","”","‘","’",")","）","」","』","】","—","—",".",",","?","!",";",":"]);

let _textTimers = [];           // 文字层独立 timer（区别于状态机 pendingTimers）
function tSet(fn, delay) { const id = setTimeout(() => { _textTimers = _textTimers.filter(t => t !== id); fn(); }, delay); _textTimers.push(id); return id; }
function clearTextTimers() { _textTimers.forEach(id => clearTimeout(id)); _textTimers = []; }
function rafP() { return new Promise(r => requestAnimationFrame(() => r())); }
function waitP(ms) { return new Promise(r => tSet(r, ms)); }

let _activeNarration = null;    // 当前停留的旁白节点（不自动消失，等上滑）
let _narrCtrl = null;           // 两段旁白控制器：revealRest()

// 气泡逐字打字机
function startTyper(node, text, perChar) {
  return new Promise((resolve) => {
    const chars = Array.from(text); let i = 0;
    const step = () => {
      if (i < chars.length) { node.textContent = chars.slice(0, i + 1).join(''); i++; tSet(step, perChar); }
      else resolve();
    };
    tSet(step, 30);
  });
}

// 旁白：2-3 字逐块浮现 + 动态暗带；支持多段（phases），段间用 <br>
function sliceForReveal(text) {
  const chars = Array.from(text); const total = chars.length; const slices = []; let i = 0;
  while (i < total) {
    const want = Math.random() < 0.45 ? 2 : 3;
    let end = Math.min(total, i + want);
    while (end < total && TRAILING_PUNCT.has(chars[end])) end++;
    slices.push(chars.slice(i, end).join('')); i = end;
  }
  return slices;
}

async function startTokenReveal(node, phasesInput) {
  const phases = Array.isArray(phasesInput) ? phasesInput : [phasesInput];
  node.classList.add('line-banner');
  node.style.setProperty('--banner-h', '0px');
  node.textContent = '';

  // 每段切片预先算好，但 chunk 不预放——一段一段动态 append，让容器随内容长大
  const phasePlans = phases.map((text) => sliceForReveal(text));

  const revealPhase = (pi) => new Promise((resolve) => {
    const slices = phasePlans[pi];
    if (!slices || !slices.length) { resolve(); return; }
    let k = 0, prevTop = null;
    const step = () => {
      if (k >= slices.length) { tSet(resolve, TOKEN_FADE_MS); return; }
      const slice = slices[k++];
      const span = document.createElement('span');
      span.className = 'gen-chunk reveal';
      span.textContent = slice;
      node.appendChild(span);
      const top = span.offsetTop;
      let delay = TOKEN_CHUNK_GAP * (1 + (Math.random() * 2 - 1) * TOKEN_CHUNK_JITTER);
      if (prevTop !== null && Math.abs(top - prevTop) > 2) delay += TOKEN_LINE_PAUSE;
      prevTop = top;
      // banner 跟着当前内容高度同步
      node.style.setProperty('--banner-h', `${node.offsetHeight + u(40)}px`);
      tSet(step, delay);
    };
    step();
  });

  await revealPhase(0);
  if (phases.length === 1) return null;
  return { revealRest: async () => {
    if (node.childNodes.length) node.appendChild(document.createElement('br'));
    for (let p = 1; p < phases.length; p++) await revealPhase(p);
  } };
}

function driftAway(node, dur = 1000) {
  return new Promise((resolve) => {
    if (dur !== 1000) node.style.animationDuration = dur + 'ms';
    node.classList.add('drifting');
    tSet(() => { if (node.parentNode) node.parentNode.removeChild(node); resolve(); }, dur);
  });
}

// 旁白：暖白；块位置由 narration-zone 居中锚住，打字机一段段浮现
async function showNarration(text, opts = {}) {
  if (_activeNarration && _activeNarration.parentNode) {
    const prev = _activeNarration; _activeNarration = null; driftAway(prev);
  }
  const node = document.createElement('div');
  node.className = 'narration' + (opts.cls ? ' ' + opts.cls : '');
  narrationZone.appendChild(node); _activeNarration = node;
  await rafP(); node.classList.add('visible');
  _narrCtrl = await startTokenReveal(node, [text]);
}

// 角色动作：月白色 + 全角括号包裹，跟角色气泡呼应
async function showAction(text) {
  return showNarration('（' + text + '）', { cls: 'narration-action' });
}

// 上滑推进：把当前旁白的下一段揭出；没有下一段则把旁白漂走
async function advanceNarration() {
  if (_narrCtrl) { const c = _narrCtrl; _narrCtrl = null; await c.revealRest(); return 'revealed'; }
  if (_activeNarration && _activeNarration.parentNode) {
    const node = _activeNarration; _activeNarration = null; await driftAway(node); return 'drifted';
  }
  return 'none';
}

// ② 一句一气泡：打完字 hold 后 drift 走；同区任意时刻最多一条气泡
const BUBBLE_HOLD = 1200;

// 用户气泡：从底部回响弧位置升起到驻留位，打完字即返回节点；
// 退场时机由 runTextDialogue 的清场编排统一调度（先描述+角色气泡涟漪退场，用户气泡最后收尾）
async function showUserBubble(text) {
  const node = document.createElement('div'); node.className = 'bubble bubble-user';
  node.style.left = '50%';
  node.style.bottom = '28%';                       // 高于"长按录音"时弧顶顶起到的 22%（弧基线 16% + vh(6) 上推）再留 ~6vh 喘息
  node.style.transform = `translateX(-50%) translateY(${u(28)}px)`;
  bubbleZone.appendChild(node);
  await rafP();
  node.classList.add('visible');
  node.style.transform = 'translateX(-50%) translateY(0)';
  await startTyper(node, text, TYPING_DIALOGUE);
  return node;
}

// 角色气泡：压栈式累积，新条出现在锚点，旧条上移 + 透明度衰减一档；不再自动 drift
const CHAR_PAD_OVERLAP = 10;         // 新旧气泡 padding 区允许重叠的像素（≤ 上下 padding 之和 20px，保文字不重叠）
const CHAR_OPACITY_STEP = 0.35;      // 每多一条新气泡，旧气泡透明度衰减一档
const CHAR_OPACITY_FLOOR = 0.2;      // 旧气泡透明度地板
let _charStack = [];                 // 当前留存的角色气泡 DOM 列表（从老到新）

async function showCharBubble(text, topPct) {
  const node = document.createElement('div'); node.className = 'bubble bubble-char';
  node.style.left = '50%';
  node.style.top = `${topPct}%`;
  node.style.zIndex = String(5 + _charStack.length);
  bubbleZone.appendChild(node);
  await rafP();

  // 位移基准：栈顶旧气泡的真实高度（它的文字已经打完，offsetHeight 是最终高度），
  // 不能用新气泡的 offsetHeight —— 此刻新气泡还没打字，只有空 padding 的高度。
  const recentOld = _charStack[_charStack.length - 1];
  const recentH = recentOld ? recentOld.offsetHeight : 0;
  const shift = recentH ? (recentH - u(CHAR_PAD_OVERLAP)) : 0;
  for (let i = 0; i < _charStack.length; i++) {
    const prev = _charStack[i];
    const cur = parseFloat(prev.dataset.stackShift || '0');
    prev.dataset.stackShift = String(cur - shift);
    prev.style.setProperty('--stack-shift', `${cur - shift}px`);
    const step = (_charStack.length - i);   // 该气泡又被推了一次
    const newOp = Math.max(CHAR_OPACITY_FLOOR, 1 - step * CHAR_OPACITY_STEP);
    prev.style.opacity = String(newOp);
  }

  _charStack.push(node);
  node.classList.add('visible');
  // 下一帧再加 settled，触发 --enter-y 从 28px 过渡到 0
  await rafP();
  node.classList.add('settled');

  await startTyper(node, text, TYPING_DIALOGUE);
  // 不再 driftAway —— 留存到下一次交互（driftDimmedText / clearAllText）清场
}

function clearAllText() {
  clearTextTimers();
  _activeNarration = null; _narrCtrl = null;
  _charStack = [];
  [narrationZone, bubbleZone].forEach((z) => { if (z) z.innerHTML = ''; });
}

// 进打字态 / 长按语音：把旁白 + 角色气泡压暗一档（filter 与 inline opacity 相乘，栈衰减层级保留）
function dimTextForRecording() {
  if (_activeNarration) _activeNarration.classList.add('dimmed-for-recording');
  _charStack.forEach((c) => c.classList.add('dimmed-for-recording'));
}
// 取消（点别处退出打字 / 录音不足 / 历史面板抢断）：摘掉 dimmed 类，filter 经 base transition 自然回到 none
function restoreDimmedText() {
  if (_activeNarration) _activeNarration.classList.remove('dimmed-for-recording');
  _charStack.forEach((c) => c.classList.remove('dimmed-for-recording'));
}
// 发送（语音松手 / 打字提交）：旁白 + 角色气泡涟漪上飘（加速版，默认 500ms），同时清引用
function driftDimmedText(dur = 500) {
  if (_activeNarration) {
    driftAway(_activeNarration, dur);
    _activeNarration = null; _narrCtrl = null;
  }
  _charStack.forEach((c) => driftAway(c, dur));
  _charStack = [];
}

// ---- 文字层演示脚本：两轮对话循环 ----
const TEXT_SCRIPT = {
  charTurns: [
    {
      action: '他靠在栏杆上，听见门响才转过头来。',
      replies: ['你来了。', '我以为你不会来。'],            // R1：2 条气泡
    },
    {
      action: '他笑了笑，下巴朝海面的方向抬了抬。',
      replies: ['也没多久。', '你来的正好。', '你来得正好，再晚一会儿天就要黑透了，那点橘色就要散在海里了。'], // R2：3 条，末条 30 字压测（15×2 触顶）
    },
  ],
  userReplies: ['等很久了？', '那就好。'],
};

let charTurnIdx = 0;     // 当前正在播 / 即将播的角色轮次下标

// 角色发起：动作 + N 条气泡，按 charTurnIdx 取脚本；播完落到 arc-invite 让用户长按回复
async function runCharTurn() {
  if (mode !== 'text') return;
  go('text-playing');  // 屏蔽 arc/fill 手势 + 隐藏底部提示，避免角色独白期间被打断
  const turn = TEXT_SCRIPT.charTurns[charTurnIdx];
  if (!turn) return;
  await showAction(turn.action);
  if (mode !== 'text') return;
  await waitP(800);
  for (let i = 0; i < turn.replies.length; i++) {
    if (i > 0) await waitP(BUBBLE_HOLD);
    await showCharBubble(turn.replies[i], 26);
    if (mode !== 'text') return;
  }
  await waitP(400);
  maybeRunOrPause(() => { if (mode === 'text') { go('arc-enter'); scheduleGo('arc-invite', 1000); } });
}

// 用户气泡发完之后推进下一轮：模运算 wrap，两轮对话无限循环（R1 ↔ R2 ↔ ...）
function advanceToNextRound() {
  if (mode !== 'text') return;
  charTurnIdx = (charTurnIdx + 1) % TEXT_SCRIPT.charTurns.length;
  maybeRunOrPause(() => { if (mode === 'text') runCharTurn(); });
}

// 用户长按松手回路：旧旁白+角色气泡涟漪上飘（500ms）→ 半程交叠时用户气泡升起 → 用户气泡 drift 收尾 → 下一轮
async function runTextDialogue() {
  if (mode !== 'text') return;
  const userReply = TEXT_SCRIPT.userReplies[charTurnIdx] || '……';

  // 录音期间它们一直以 dimmed 态留在屏幕上；松手瞬间一起涟漪上飘消失（加速版 500ms）
  driftDimmedText(500);
  // 半程（250ms）后用户气泡升起，跟上飘交叠入场，画面不留空白
  await waitP(250);
  if (mode !== 'text') return;
  const userNode = await showUserBubble(userReply);
  if (mode !== 'text') return;

  // 用户气泡保留 drift 作为"句点"收尾
  tSet(() => driftAway(userNode, 700), 600);
  await waitP(1200);
  advanceToNextRound();
}

// ============================================================
// 新手引导
// ============================================================
let arcTutorialCount = 0, fillTutorialCount = 0, typingTutorialCount = 0;
const arcTextEl = document.getElementById('tutorial-text-arc');
const fillTextEl = document.getElementById('tutorial-text-fill');

// 引导文字在「长按区域，语音输入」「点按区域，打字输入」之间交替；周期 2.1s，踩呼吸过零点。
// 每个周期首尾 10% 区间做 crossfade（淡出→换文字→淡入），避免硬切。
const HINT_SWAP_PERIOD = P.arcBreathPeriod / 2;  // 单位 s
const HINT_TEXT_VOICE = '长按区域，语音输入';
const HINT_TEXT_TYPE  = '点按区域，打字输入';
function pickArcHint(now) {
  const cyclePos = (now / 1000) / HINT_SWAP_PERIOD;
  const cycleIdx = Math.floor(cyclePos);
  const tInCycle = cyclePos - cycleIdx;
  const arcDone = arcTutorialCount >= 2;
  const typingDone = typingTutorialCount >= 2;
  let text;
  if (arcDone && typingDone) return { text:'', fade:0 };
  else if (arcDone)   text = HINT_TEXT_TYPE;
  else if (typingDone) text = HINT_TEXT_VOICE;
  else text = (cycleIdx % 2 === 0) ? HINT_TEXT_VOICE : HINT_TEXT_TYPE;
  let fade = 1;
  if (!arcDone && !typingDone) {
    if (tInCycle < 0.10)      fade = tInCycle / 0.10;
    else if (tInCycle > 0.90) fade = (1 - tInCycle) / 0.10;
  }
  return { text, fade };
}

function drawArcTutorial(arcAlpha) {
  if (mode === 'text') { arcTextEl.style.opacity = '0'; return; }
  // 跟 updateStage 同一口径：长按语音 + 短按打字 合计 2 次算完成
  const tutorialDone = (arcTutorialCount + typingTutorialCount) >= 2;
  if (tutorialDone || arcAlpha < 0.005) { arcTextEl.style.opacity = '0'; return; }
  const a = arcAlpha * 0.6;
  ctxM.save(); ctxM.scale(dpr, dpr);
  const top = H * 0.6;
  const grad = ctxM.createLinearGradient(0, top, 0, top + vh(7));
  grad.addColorStop(0, 'rgba(255,235,210,0)');
  grad.addColorStop(1, `rgba(255,235,210,${a})`);
  ctxM.fillStyle = grad; ctxM.fillRect(0, top, W, vh(7));
  ctxM.fillStyle = `rgba(255,235,210,${a})`; ctxM.fillRect(0, top + vh(7), W, H - top - vh(7));
  ctxM.restore();
  // 注入呼吸节奏交替的文案 + 淡入淡出
  const { text, fade } = pickArcHint(performance.now());
  if (text && arcTextEl.textContent !== text) arcTextEl.textContent = text;
  // 呼吸反相：亮池亮（arcAlpha 峰值 ~0.90）时字推到 1.0 全力撑出；亮池暗（arcAlpha 谷值 ~0.40）时字回退到 ~0.65 让位。
  // 公式 arcAlpha*0.7 + 0.37 把 0.40→0.65、0.90→1.00 线性映射，swing 从原来的 0.23 拉到 0.35，呼吸更明显。
  arcTextEl.style.opacity = String(Math.min(1.0, arcAlpha * 0.7 + 0.37) * fade);
}

function drawFillTutorial(fillAlpha, now) {
  if (mode === 'text') { fillTextEl.style.opacity = '0'; return; }
  if (fillTutorialCount >= 2) { fillTextEl.style.opacity = '0'; return; }
  if (fillAlpha < 0.005) { fillTextEl.style.opacity = '0'; return; }
  const r = vw(P.radiusVW), cycleDur = 3.0;
  const raw = ((now / 1000) % cycleDur) / cycleDur;
  const t = 1 - Math.pow(1 - raw, 2);
  const startY = H + vh(5), endY = H / 3;
  const arcTopY = startY + (endY - startY) * t;
  const bandCy = arcTopY + r;
  const fadeA = fillAlpha * (1 - t);
  if (fadeA < 0.005) return;
  ctxM.save(); ctxM.scale(dpr, dpr);
  const { s, e } = arcAngles(W/2, bandCy, r);
  ctxM.beginPath(); ctxM.arc(W/2, bandCy, r, s, e);
  ctxM.lineTo(W/2 + r*Math.cos(e), H+40); ctxM.lineTo(W/2 + r*Math.cos(s), H+40); ctxM.closePath();
  const feather = vh(5), gradTop = arcTopY - feather, gradBot = H + 20, gradH = gradBot - gradTop;
  const peakStop = Math.min(0.4, feather / gradH);
  const grad = ctxM.createLinearGradient(0, gradTop, 0, gradBot);
  grad.addColorStop(0, 'rgba(255,235,210,0)');
  grad.addColorStop(peakStop, `rgba(255,235,210,${fadeA})`);
  grad.addColorStop(Math.min(0.6, peakStop + 0.2), `rgba(255,235,210,${fadeA * 0.3})`);
  grad.addColorStop(1, 'rgba(255,235,210,0)');
  ctxM.fillStyle = grad; ctxM.fill(); ctxM.restore();
  fillTextEl.style.opacity = Math.min(0.9, fillAlpha * 2.5 + 0.45);
}

// ============================================================
// 状态机
// ============================================================
let state = 'arc-enter', stateT = 0;

function go(s) {
  // history-exit 完成后的回调
  if (s === '_exit-done') { _onExitDone(); return; }

  state = s; stateT = performance.now(); rippleTimer = 0;

  // 进 arc-record 立即定字「松手发送」；arc-enter/arc-invite 由 drawArcTutorial 随呼吸周期交替注入
  if (s === 'arc-record' && arcTutorialCount < 2) { arcTextEl.textContent = '松手发送'; arcTextEl.style.opacity = '0.85'; }
  else if (s !== 'arc-enter' && s !== 'arc-invite') arcTextEl.style.opacity = '0';
  if (s !== 'fill-enter' && s !== 'fill-idle') fillTextEl.style.opacity = '0';
  if (s === 'arc-record') { arcTutorialCount++; updateStage(); }
  // text 模式下，进 arc-record 把描述+角色气泡压暗一档（保留可见，舞台焦点让给用户）
  if (s === 'arc-record' && mode === 'text') dimTextForRecording();
  if (s === 'fill-commit') { fillTutorialCount++; fillCommitCount++; updateStage(); }

  if (s === 'history-idle') {
    const _r = vw(P.radiusVW);
    setMask(historyPanel, _r - u(7), W / 2, (H * 2 / 3 - _r + u(120)), 10);
    historyPanel.style.pointerEvents = 'auto';
  }

  const tags = {
    'fill-enter':'上滑色块 · 浮出','fill-idle':'上滑色块 · 就绪','fill-swipe':'上滑色块 · 拖动中',
    'fill-commit':'上滑色块 · 推进','arc-enter':'回响弧 · 浮起','arc-invite':'回响弧 · 邀请',
    'arc-record':'回响弧 · 录音','arc-close':'回响弧 · 收回',
    'arc-typing-enter':'回响弧 · 伸直','arc-typing':'回响弧 · 打字','arc-typing-exit':'回响弧 · 复位',
    'history-enter':'历史面板 · 入场','history-idle':'历史面板 · 就绪',
    'history-exit':'历史面板 · 收回',
    'text-idle':'文字层 · 演示',
  };
}

// ============================================================
// 打字层（短按弧→输入条→发送→气泡；外侧点击退出留草稿光点）
// ============================================================
const typingLayer = document.getElementById('typing-layer');
const typingInput = document.getElementById('typing-input');
const typingSend = document.getElementById('typing-send');
let draftText = '';
let hasDraft = false;

function updateSendActive() {
  if (typingInput.value.trim().length > 0) typingSend.classList.add('active');
  else typingSend.classList.remove('active');
}
typingInput.addEventListener('input', updateSendActive);

// Android Chrome 兜底：键盘开着时，用户点 input 区域外的画面，系统会"吃掉"这次点击用来关键盘，
// pointerdown 不会冒到我们的 stage handler 上 → exit 流程不会跑。用 focusout 作为"用户想退出打字态"
// 的等价信号把退出流程补上。
// 三道防误触：
//   1) 入场 350ms 内的 focusout 多半是 click 期间浏览器把焦点漂到 body 的副作用，跳过
//   2) 焦点漂到自家发送按钮（typing-layer 内部）→ 是合法操作（点发送），跳过；否则点发送时这里会先摘
//      .entered 让按钮 pointer-events:none，导致 click 不再派发到 sendTyping，气泡就发不出去
//   3) 程序性 hideTypingUI 已经先摘掉 .entered → 第三道条件失败自然短路
let typingFocusedAt = 0;
typingInput.addEventListener('focusout', (e) => {
  if (performance.now() - typingFocusedAt < 350) return;
  if (e.relatedTarget && typingLayer.contains(e.relatedTarget)) return;
  if (typingLayer.classList.contains('entered') &&
      (state === 'arc-typing' || state === 'arc-typing-enter')) {
    exitTypingToDraft();
  }
});

function showTypingUI() {
  // input 不能用 display:none 切显隐——iOS Safari 在刚 unhide 的 input 上 focus() 不弹键盘。
  // 所以 input 始终在 layout 里，这里只翻 .entered 控显隐 + 同步 focus()。
  typingInput.value = draftText || '';
  updateSendActive();
  // 关键顺序：先放开 pointer-events:none 再 focus()，否则 Android Chrome 认为 input 不可交互、跳过弹键盘
  typingLayer.classList.add('entered');
  // focus 必须在 pointerup 这条手势链路里同步触发；preventScroll 在 Android 上会跳过弹键盘所必需的内部路径，故不传
  typingFocusedAt = performance.now();    // blur handler 用来判断"这次 blur 是不是入场副作用"
  try { typingInput.focus(); } catch (_) {}
  // 把光标移到末尾
  const len = typingInput.value.length;
  try { typingInput.setSelectionRange(len, len); } catch (_) {}
}

function hideTypingUI() {
  typingLayer.classList.remove('entered');
  try { typingInput.blur(); } catch (_) {}
}

function enterTypingMode() {
  clearAllTimers();
  resetGesture();
  // 文字层下：进打字态把旁白 + 角色气泡压暗一档（保留可见，跟长按语音同款 dim）
  if (mode === 'text') dimTextForRecording();
  showTypingUI();
  go('arc-typing-enter');
  scheduleGo('arc-typing', 280);
}

function exitTypingToDraft() {
  draftText = typingInput.value;
  hasDraft = draftText.trim().length > 0;
  hideTypingUI();
  // 中途取消回到回响弧：旁白 + 角色气泡复原到正常亮度
  if (mode === 'text') restoreDimmedText();
  go('arc-typing-exit');
  scheduleGo('arc-invite', 450);
}

async function sendTyping() {
  const text = typingInput.value.trim();
  if (!text) return;
  draftText = '';
  hasDraft = false;
  typingInput.value = '';
  updateSendActive();
  hideTypingUI();
  go('arc-typing-exit');
  scheduleGo('arc-invite', 450);
  typingTutorialCount++; updateStage();
  pulseHistoryAnchor();
  // 跟长按语音同节奏：旧旁白+角色气泡 500ms 涟漪上飘 → 半程交叠用户气泡升起 → hold + drift 收尾
  if (mode === 'text') driftDimmedText(500);
  await waitP(250);
  const node = await showUserBubble(text);
  await waitP(BUBBLE_HOLD);
  await driftAway(node);
  advanceToNextRound();
}

typingSend.addEventListener('click', (e) => { e.stopPropagation(); sendTyping(); });
typingInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendTyping(); }
  else if (e.key === 'Escape') { e.preventDefault(); exitTypingToDraft(); }
});

// ============================================================
// 手势
// ============================================================
let down = null, swipeProgress = 0, commitFromProgress = 0, longPressTimer = null, pressing = false;
let arcEnterAccel = false, arcEnterAccelStart = 0;

document.addEventListener('contextmenu', e => e.preventDefault());
function getLocalY(e) { return e.clientY - phone.getBoundingClientRect().top; }
function getLocalX(e) { return e.clientX - phone.getBoundingClientRect().left; }

// 录音最短时长：进 arc-record 后至少保持这么久，否则视为"没录上内容"回到 arc-invite
const ARC_RECORD_MIN_MS = 700;
function abortRecording() {
  if (mode === 'text') restoreDimmedText();
  go('arc-invite');
}

document.getElementById('stage').addEventListener('pointerdown', (e) => {
  if (mode.startsWith('login')) return;
  if (state.startsWith('history')) return;
  if (e.target.closest('.history-anchor')) return;
  // 打字态下：点输入框/发送按钮 → 让其自处理；点其它任何区域(含假键盘) → 退到草稿态
  if (state === 'arc-typing' || state === 'arc-typing-enter') {
    if (e.target.closest('.typing-input') || e.target.closest('.typing-send')) return;
    exitTypingToDraft();
    return;
  }
  // 输入框/发送按钮上的点击交给它们自己处理，避免误触发底层手势
  if (e.target.closest('.typing-input') || e.target.closest('.typing-send')) return;
  const ly = getLocalY(e), lx = getLocalX(e);
  down = { x: lx, y: ly, t: performance.now() };
  if (state === 'arc-invite' || state === 'arc-enter') {
    if (ly < H * 2 / 3) return;
    pressing = true;
    if (state === 'arc-enter') {
      clearAllTimers();
      arcEnterAccel = true;
      arcEnterAccelStart = Math.min(1, (performance.now() - stateT) / 1000);
    }
    longPressTimer = setTimeout(() => { if (pressing) { arcEnterAccel = false; go('arc-record'); rippleTimer = 400; } }, 250);
  }
});
document.getElementById('stage').addEventListener('pointermove', (e) => {
  if (mode.startsWith('login')) return;
  if (!down || state.startsWith('history')) return;
  const ly = getLocalY(e);
  if (state === 'fill-idle' || state === 'fill-swipe') {
    swipeProgress = Math.max(0, Math.min(1.3, -(ly - down.y) / 40));
    if (swipeProgress > 0.05 && state === 'fill-idle') state = 'fill-swipe';
  }
});
document.getElementById('stage').addEventListener('pointerup', (e) => {
  if (mode.startsWith('login')) { down = null; pressing = false; return; }
  if (!down || state.startsWith('history')) { down = null; pressing = false; return; }
  const ly = getLocalY(e), dy = ly - down.y, dt = performance.now() - down.t, vy = dy / Math.max(1, dt);
  if (state === 'fill-swipe' || state === 'fill-idle') {
    if (dy <= -40 || vy <= -0.25) {
      commitFromProgress = Math.min(1, swipeProgress); go('fill-commit');
      // 文字层下 fill-* 永远不会进入（脚本不再有"上滑推进旁白"那条路），所以只剩 fill 模式分支
      scheduleGo('fill-enter', 500); scheduleGo('fill-idle', 2100);
    } else { swipeProgress = 0; go('fill-idle'); }
  } else if (state === 'arc-record') {
    const recordDur = performance.now() - stateT;
    if (recordDur < ARC_RECORD_MIN_MS) {
      // 录音时长不足：视为没录上内容，回 arc-invite 并恢复描述+角色气泡
      abortRecording();
    } else {
      go('arc-close');
      if (mode === 'text') {
        runTextDialogue();
        pulseHistoryAnchor();
      } else {
        scheduleGo('arc-enter', 550);
        scheduleGo('arc-invite', 1550);
        // 长按语音流程：松手后弹出占位气泡，跟"打字发送"对称
        (async () => {
          const node = await showUserBubble('长按语音输入内容');
          await waitP(BUBBLE_HOLD);
          await driftAway(node);
        })();
      }
    }
  } else if ((state === 'arc-invite' || state === 'arc-enter') && pressing) {
    // 短按（250ms 内松手，位移很小）→ 进打字态
    const movedSq = (getLocalX(e) - down.x) ** 2 + (ly - down.y) ** 2;
    if (dt < 250 && movedSq < 64) {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      pressing = false; down = null;
      enterTypingMode();
      return;
    }
  }
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  pressing = false; down = null;
});
document.getElementById('stage').addEventListener('pointercancel', () => {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  pressing = false; down = null; swipeProgress = 0;
  if (state === 'fill-swipe') go('fill-idle');
  // 录音中途被打断（如系统手势接管）→ 回 arc-invite 并恢复描述+角色气泡
  if (state === 'arc-record') abortRecording();
});

// ============================================================
// 绘制
// ============================================================

// 弧顶角度（回响弧 / 上滑色块用）
function arcAngles(cx, cy, r) {
  const m = vw(20);
  const a0 = Math.asin(Math.max(-1, Math.min(1, (cx-(W+m))/r)));
  const a1 = Math.asin(Math.max(-1, Math.min(1, (cx-(-m))/r)));
  return { s: -Math.PI/2+a0, e: -Math.PI/2+a1 };
}

// 弧底角度（历史面板用：向下凸的弧）
function arcAnglesDown(cx, cy, r) {
  const m = vw(20);
  const cosR = Math.max(-1, Math.min(1, (W + m - cx) / r));
  const cosL = Math.max(-1, Math.min(1, (-m - cx) / r));
  return { s: Math.acos(cosR), e: Math.acos(cosL) };
}

function drawStroke(cx, cy, r, sw, alpha, glowAlpha) {
  // sw 是设计稿 pt，u() 转成当前 phone-frame 下的实际像素
  const { s, e } = arcAngles(cx, cy, r);
  if (alpha > 0.005) {
    ctxM.save(); ctxM.scale(dpr, dpr);
    ctxM.beginPath(); ctxM.arc(cx, cy, r, s, e);
    ctxM.strokeStyle = `rgba(255,235,210,${alpha})`; ctxM.lineWidth = u(sw); ctxM.lineCap = 'round'; ctxM.stroke();
    ctxM.restore();
  }
  if (glowAlpha > 0.005) {
    ctxG.save(); ctxG.scale(dpr, dpr);
    ctxG.beginPath(); ctxG.arc(cx, cy, r, s, e);
    ctxG.strokeStyle = `rgba(255,235,210,${glowAlpha})`; ctxG.lineWidth = u(sw + 6); ctxG.lineCap = 'round'; ctxG.stroke();
    ctxG.restore();
  }
}

function drawFill(cx, cy, r, alpha) {
  if (alpha < 0.005) return;
  ctxM.save(); ctxM.scale(dpr, dpr);
  const { s, e } = arcAngles(cx, cy, r);
  ctxM.beginPath(); ctxM.arc(cx, cy, r, s, e);
  ctxM.lineTo(cx + r*Math.cos(e), H+40); ctxM.lineTo(cx + r*Math.cos(s), H+40); ctxM.closePath();
  const grad = ctxM.createLinearGradient(0, cy-r, 0, H+20);
  grad.addColorStop(0, `rgba(255,235,210,${alpha})`);
  grad.addColorStop(0.5, `rgba(255,235,210,${alpha*0.35})`);
  grad.addColorStop(1, 'rgba(255,235,210,0)');
  ctxM.fillStyle = grad; ctxM.fill();
  ctxM.beginPath(); ctxM.arc(cx, cy, r, s, e);
  ctxM.strokeStyle = `rgba(255,235,210,${Math.min(0.3,alpha*1.2)})`; ctxM.lineWidth = 1; ctxM.stroke();
  ctxM.restore();
}

// ---- 历史面板：向下凸弧，圆心在弧线上方 ----
function drawHistoryPanelFill(cx, cy, r, alpha) {
  if (alpha < 0.005) return;
  const { s, e } = arcAnglesDown(cx, cy, r);

  // 遮罩：压暗整个舞台
  ctxM.save(); ctxM.scale(dpr, dpr);
  ctxM.fillStyle = `rgba(7,8,17,${alpha * 0.55})`;
  ctxM.fillRect(0, 0, W, H);
  ctxM.restore();

  // 面板填充：弧以上区域
  ctxM.save(); ctxM.scale(dpr, dpr);
  ctxM.beginPath();
  ctxM.moveTo(-40, -40);
  ctxM.lineTo(W + 40, -40);
  ctxM.lineTo(cx + r * Math.cos(s), cy + r * Math.sin(s));
  ctxM.arc(cx, cy, r, s, e);
  ctxM.closePath();
  ctxM.fillStyle = `rgba(22, 20, 16, ${alpha})`;
  ctxM.fill();
  ctxM.restore();

  // 弧底边描边
  ctxM.save(); ctxM.scale(dpr, dpr);
  ctxM.beginPath(); ctxM.arc(cx, cy, r, s, e);
  ctxM.strokeStyle = `rgba(255,235,210,${alpha * 0.2})`; ctxM.lineWidth = 1; ctxM.stroke();
  ctxM.restore();

  // 弧光晕
  if (alpha > 0.1) {
    ctxG.save(); ctxG.scale(dpr, dpr);
    ctxG.beginPath(); ctxG.arc(cx, cy, r, s, e);
    ctxG.strokeStyle = `rgba(255,235,210,${alpha * 0.08})`; ctxG.lineWidth = u(8); ctxG.stroke();
    ctxG.restore();
  }
}

const ripples = [];
let rippleTimer = 0;
function spawnRipple(cx, cy, r) { ripples.push({ cx, cy, r, t: 0 }); }
function tickRipples(dt) {
  if (!ripples.length) return;
  ctxM.save(); ctxM.scale(dpr, dpr);
  for (let i = ripples.length-1; i >= 0; i--) {
    const rp = ripples[i]; rp.t += dt;
    if (rp.t > 1800) { ripples.splice(i,1); continue; }
    const p = rp.t/1800, a = (1-p)*0.55;
    ctxM.beginPath(); ctxM.arc(rp.cx, rp.cy - p*vh(22), rp.r + p*vh(4),
      ...Object.values(arcAngles(rp.cx, rp.cy - p*vh(22), rp.r + p*vh(4))));
    ctxM.strokeStyle = `rgba(255,235,210,${a})`; ctxM.lineWidth = u(1.5); ctxM.stroke();
  }
  ctxM.restore();
}

// ============================================================
// 动画主循环
// ============================================================
let lastT = 0;

function tick(now) {
  const dt = lastT ? Math.min(50, now-lastT) : 16; lastT = now;
  ctxM.clearRect(0, 0, cMain.width, cMain.height);
  ctxG.clearRect(0, 0, cGlow.width, cGlow.height);
  cGlow.style.filter = `blur(${u(P.glowBlur)}px)`;
  // 登录模式（方案 Y）：底部只画一条真回响弧（暖白、呼吸，跟 arc-invite idle 同源）
  // 弧在纸面外，构成"光与纸"的对比；纸面承载文字与输入框
  if (mode.startsWith('login')) {
    const _r = vw(P.radiusVW), _cx = W/2;
    const _baseCy = H + _r - vh(P.arcPeekVH);
    const _b = Math.sin(now / 1000 / P.arcBreathPeriod * Math.PI*2);
    drawStroke(_cx, _baseCy - vh(P.arcBreathAmp)*_b*0.5, _r, P.strokeWidth, 0.7 + 0.2*_b, 0.15 + 0.1*_b);
    requestAnimationFrame(tick);
    return;
  }

  const r = vw(P.radiusVW), cx = W/2;
  const elapsed = (now - stateT) / 1000;

  // ---- 上滑色块 ----
  if (state === 'fill-enter') {
    const preDur = 1.0;
    if (elapsed < preDur) {
      const p = elapsed / preDur;
      const pulse = Math.pow(Math.max(0, Math.sin(p * Math.PI)), 1.6);
      ctxM.save(); ctxM.scale(dpr, dpr);
      ctxM.translate(W/2, H); ctxM.scale(1, 0.25); ctxM.translate(-W/2, -H);
      const grad = ctxM.createRadialGradient(W/2, H, 0, W/2, H, W*0.5);
      grad.addColorStop(0, `rgba(255,235,210,${pulse*0.6})`);
      grad.addColorStop(0.15, `rgba(255,235,210,${pulse*0.35})`);
      grad.addColorStop(0.4, `rgba(255,235,210,${pulse*0.12})`);
      grad.addColorStop(1, 'rgba(255,235,210,0)');
      ctxM.fillStyle = grad; ctxM.fillRect(0, H - W*0.5, W, W*0.5);
      ctxM.restore();
    }
    if (elapsed > 0.6) {
      const toCy = H + r - vh(P.fillPeekVH), fromCy = toCy + vh(P.fillPeekVH + 3);
      const t = Math.min(1, (elapsed - 0.6) / 1.0), e = 1 - Math.pow(1-t, 2.5);
      drawFillTutorial(P.fillAlpha * e, now);
      drawFill(cx, fromCy + (toCy-fromCy)*e, r, P.fillAlpha * e);
    }
  }
  else if (state === 'fill-idle') {
    const baseCy = H + r - vh(P.fillPeekVH), b = Math.sin(elapsed / P.fillBreathPeriod * Math.PI*2);
    const fillA = P.fillAlpha * (1+0.2*b);
    drawFillTutorial(fillA, now);
    drawFill(cx, baseCy - vh(P.fillBreathAmp)*b*0.5, r, fillA);
  }
  else if (state === 'fill-swipe') {
    const baseCy = H + r - vh(P.fillPeekVH), p = Math.min(1, swipeProgress);
    drawFill(cx, baseCy - vh(8)*p, r, P.fillAlpha + 0.1*p);
  }
  else if (state === 'fill-commit') {
    const baseCy = H + r - vh(P.fillPeekVH), startOff = vh(8) * commitFromProgress;
    const t = Math.min(1, elapsed / 0.5), e = 1 - Math.pow(1-t, 3);
    drawFill(cx, baseCy - (startOff + (vh(14)-startOff)*e), r, (P.fillAlpha+0.1*commitFromProgress)*(1-e));
  }

  // ---- 回响弧 ----
  else if (state === 'arc-enter') {
    const toCy = H + r - vh(P.arcPeekVH), fromCy = toCy + vh(5);
    let t;
    if (arcEnterAccel) { const ae = elapsed - arcEnterAccelStart; t = Math.min(1, arcEnterAccelStart + (1-arcEnterAccelStart)*Math.min(1, ae/0.15)); }
    else t = Math.min(1, elapsed / 1.0);
    const e = 1 - Math.pow(1-t, 2.5), cy = fromCy + (toCy-fromCy)*e;
    drawArcTutorial(0.7 * e);
    drawStroke(cx, cy, r, P.strokeWidth, 0.7 * e, 0.15 * e);
  }
  else if (state === 'arc-invite') {
    const baseCy = H + r - vh(P.arcPeekVH), b = Math.sin(elapsed / P.arcBreathPeriod * Math.PI*2);
    drawArcTutorial(0.65 + 0.25*b);   // 光池呼吸：波峰保持，波谷拉低 → 振幅 0.2 → 0.25，沉得更深
    drawStroke(cx, baseCy - vh(P.arcBreathAmp)*b*0.5, r, P.strokeWidth, 0.7 + 0.2*b, 0.15+0.1*b);
  }
  else if (state === 'arc-record') {
    const baseCy = H + r - vh(P.arcPeekVH), t = Math.min(1, elapsed / 0.4), e = 1 - Math.pow(1-t, 3);
    drawStroke(cx, baseCy - vh(6)*e, r, P.strokeWidth*1.4, 0.95, 0.15+0.85*e);
    rippleTimer += dt;
    if (rippleTimer > 600) { rippleTimer = 0; spawnRipple(cx, baseCy - vh(6)*e, r); }
  }
  else if (state === 'arc-close') {
    const raisedCy = H + r - vh(P.arcPeekVH) - vh(6), restCy = H + r - vh(P.fillPeekVH);
    const t = Math.min(1, elapsed / 0.45), e = 1 - Math.pow(1-t, 2), cy = raisedCy + (restCy-raisedCy)*e;
    let ga = 0; if (elapsed < 0.35) ga = 0.6 * Math.sin(elapsed/0.35*Math.PI);
    drawStroke(cx, cy, r, P.strokeWidth, 0.8*(1-e), ga);
  }

  // ---- 打字态：底部回响弧淡出/淡入；键盘上方不再画下划线，输入条裸放在键盘上方 ----
  else if (state === 'arc-typing-enter') {
    const baseCy = H + r - vh(P.arcPeekVH);
    const t = Math.min(1, elapsed / 0.28), e = 1 - Math.pow(1 - t, 3);
    drawStroke(cx, baseCy, r, P.strokeWidth, 0.85 * (1 - e), 0.15 * (1 - e));
  }
  else if (state === 'arc-typing') {
    // 稳态：弧已隐去，画面只剩 DOM 元素（输入框 / 发送按钮 / 假键盘）
  }
  else if (state === 'arc-typing-exit') {
    const baseCy = H + r - vh(P.arcPeekVH);
    const t = Math.min(1, elapsed / 0.45), e = 1 - Math.pow(1 - t, 3);
    drawStroke(cx, baseCy, r, P.strokeWidth, 0.85 * e, 0.15 * e);
  }

  // ---- 历史面板（圆心在弧线上方，弧向下凸） ----
  else if (state === 'history-enter') {
    const dur = 0.5, t = Math.min(1, elapsed / dur), ease = 1 - Math.pow(1-t, 2.5);

    const endCx = W / 2;
    const endCy = (H * 2 / 3 - r + u(120));
    const startCx = W * 0.15;
    const startCy = -(r * 1.1);

    const aCx = startCx + (endCx - startCx) * ease;
    const aCy = startCy + (endCy - startCy) * ease;

    drawHistoryPanelFill(aCx, aCy, r, ease * 0.97);

    const { s: ds, e: de } = arcAnglesDown(aCx, aCy, r);
    ctxM.save(); ctxM.scale(dpr, dpr);
    ctxM.beginPath(); ctxM.arc(aCx, aCy, r, ds, de);
    ctxM.strokeStyle = `rgba(255,235,210,${ease * 0.55})`;
    ctxM.lineWidth = u(2); ctxM.stroke();
    ctxM.restore();
    ctxG.save(); ctxG.scale(dpr, dpr);
    ctxG.beginPath(); ctxG.arc(aCx, aCy, r, ds, de);
    ctxG.strokeStyle = `rgba(255,235,210,${ease * 0.25})`;
    ctxG.lineWidth = u(12); ctxG.stroke();
    ctxG.restore();

    // 文字跟随弧线落位，边缘渐隐
    setMask(historyPanel, r - u(7), aCx, aCy, 10);
  }
  else if (state === 'history-idle') {
    const endCy = (H * 2 / 3 - r + u(120));
    const b = Math.sin(elapsed / 6 * Math.PI * 2);
    drawHistoryPanelFill(W / 2, endCy, r, 0.97);

    const settle = Math.min(1, elapsed / 0.4);
    const sw = 2 - settle * 1;
    const sa = 0.55 - settle * (0.55 - 0.15) + 0.04 * b * settle;
    const ga = 0.25 * (1 - settle);

    const { s, e } = arcAnglesDown(W/2, endCy, r);
    ctxM.save(); ctxM.scale(dpr, dpr);
    ctxM.beginPath(); ctxM.arc(W/2, endCy, r, s, e);
    ctxM.strokeStyle = `rgba(255,235,210,${sa})`; ctxM.lineWidth = u(sw); ctxM.stroke();
    ctxM.restore();
    if (ga > 0.005) {
      ctxG.save(); ctxG.scale(dpr, dpr);
      ctxG.beginPath(); ctxG.arc(W/2, endCy, r, s, e);
      ctxG.strokeStyle = `rgba(255,235,210,${ga})`; ctxG.lineWidth = u(12); ctxG.stroke();
      ctxG.restore();
    }
  }
  else if (state === 'history-exit') {
    const dur = 0.35, t = Math.min(1, elapsed / dur), ease = 1 - Math.pow(1-t, 2);
    const progress = 1 - ease;

    const endCx = W / 2;
    const endCy = (H * 2 / 3 - r + u(120));
    const exitCx = W * 0.15;
    const exitCy = -(r * 1.1);

    const aCx = endCx + (exitCx - endCx) * ease;
    const aCy = endCy + (exitCy - endCy) * ease;

    drawHistoryPanelFill(aCx, aCy, r, progress * 0.97);

    const { s: ds, e: de } = arcAnglesDown(aCx, aCy, r);
    ctxM.save(); ctxM.scale(dpr, dpr);
    ctxM.beginPath(); ctxM.arc(aCx, aCy, r, ds, de);
    ctxM.strokeStyle = `rgba(255,235,210,${progress * 0.4})`;
    ctxM.lineWidth = u(2); ctxM.stroke();

    // 文字跟随弧线收回，边缘渐隐
    setMask(historyPanel, r - u(7), aCx, aCy, 10);
    ctxM.restore();
    ctxG.save(); ctxG.scale(dpr, dpr);
    ctxG.beginPath(); ctxG.arc(aCx, aCy, r, ds, de);
    ctxG.strokeStyle = `rgba(255,235,210,${progress * 0.15})`;
    ctxG.lineWidth = u(10); ctxG.stroke();
    ctxG.restore();

  }

  tickRipples(dt);
  requestAnimationFrame(tick);
}

// ============================================================
// 登录板块：子页切换 + 按钮反馈 + 演示验证
// ============================================================
const loginLayer = document.getElementById('login-layer');
const loginPages = Array.from(loginLayer.querySelectorAll('.login-page'));
const loginBtns  = Array.from(loginLayer.querySelectorAll('.login-btn'));

// 展示登录层 + 切到指定子页
function showLoginMode(m) {
  loginLayer.classList.add('visible');
  switchLoginPage(m);
}
function hideLoginLayer() {
  loginLayer.classList.remove('visible');
}

// 子页切换：旧页淡出 0.25s → 摘 active → 新页 active → 下帧加 entered 触发淡入
let _loginSwitching = false;
function switchLoginPage(target) {
  const targetEl = loginPages.find(p => p.dataset.page === target);
  if (!targetEl) return;
  const currentEl = loginPages.find(p => p.classList.contains('active'));
  if (currentEl === targetEl) {
    // 启动期：首次直接亮起，跳过淡出
    if (!currentEl.classList.contains('entered')) {
      requestAnimationFrame(() => currentEl.classList.add('entered'));
    }
    return;
  }
  if (_loginSwitching) return;
  _loginSwitching = true;
  if (currentEl) {
    currentEl.classList.remove('entered');                  // 触发淡出
    setTimeout(() => {
      currentEl.classList.remove('active');
      targetEl.classList.add('active');
      requestAnimationFrame(() => {
        targetEl.classList.add('entered');
        _loginSwitching = false;
      });
    }, 260);
  } else {
    targetEl.classList.add('active');
    requestAnimationFrame(() => { targetEl.classList.add('entered'); _loginSwitching = false; });
  }
  // 清掉错误提示 + 输入框抖动残留
  loginLayer.querySelectorAll('.login-error.visible').forEach(e => e.classList.remove('visible'));
  loginLayer.querySelectorAll('.login-input.shake').forEach(e => e.classList.remove('shake'));
}

// 输入框值变化 → 主按钮 .active；同一页里所有 input 都非空才亮
loginPages.forEach(page => {
  const inputs = Array.from(page.querySelectorAll('.login-input'));
  const btn = page.querySelector('.login-btn');
  if (!inputs.length || !btn) return;
  const sync = () => {
    const allFilled = inputs.every(i => i.value.trim().length > 0);
    btn.classList.toggle('active', allFilled);
  };
  inputs.forEach(i => i.addEventListener('input', sync));
});

// 按钮亮起反馈：中心光发散一圈
function flareButton(btn) {
  btn.classList.remove('flaring');
  void btn.offsetWidth;
  btn.classList.add('flaring');
  setTimeout(() => btn.classList.remove('flaring'), 600);
}

// 邀请码：空 → 抖动+错误；非空 → 亮起+切手机号页
const inviteInput = document.getElementById('login-invite-input');
const inviteBtn   = document.getElementById('login-invite-btn');
const inviteError = document.getElementById('login-invite-error');
function submitInvite() {
  const v = inviteInput.value.trim();
  if (!v) {
    inviteInput.classList.remove('shake');
    void inviteInput.offsetWidth;
    inviteInput.classList.add('shake');
    inviteError.classList.add('visible');
    setTimeout(() => inviteError.classList.remove('visible'), 1600);
    return;
  }
  flareButton(inviteBtn);
  setTimeout(() => switchMode('login-phone'), 360);
}
inviteBtn.addEventListener('click', submitInvite);
inviteInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitInvite(); } });

// 手机号 / 账号密码：演示按钮亮起反馈，不串后续
const phoneBtn    = document.getElementById('login-phone-btn');
const passwordBtn = document.getElementById('login-password-btn');
phoneBtn.addEventListener('click', () => flareButton(phoneBtn));
passwordBtn.addEventListener('click', () => flareButton(passwordBtn));

// 获取验证码：2 秒倒计时演示
const codeBtn = document.getElementById('login-code-btn');
let codeTimer = null;
codeBtn.addEventListener('click', () => {
  if (codeBtn.disabled) return;
  const phoneVal = document.getElementById('login-phone-input').value.trim();
  if (!phoneVal) {
    const phoneEl = document.getElementById('login-phone-input');
    phoneEl.classList.remove('shake'); void phoneEl.offsetWidth; phoneEl.classList.add('shake');
    return;
  }
  let remain = 2;                                 // demo：跑 2 秒就放回去
  codeBtn.disabled = true;
  codeBtn.textContent = `${remain}s`;
  if (codeTimer) clearInterval(codeTimer);
  codeTimer = setInterval(() => {
    remain--;
    if (remain <= 0) {
      clearInterval(codeTimer); codeTimer = null;
      codeBtn.disabled = false;
      codeBtn.textContent = '获取验证码';
    } else {
      codeBtn.textContent = `${remain}s`;
    }
  }, 1000);
});

// 底部链接：手机号 ↔ 账号密码 互切
loginLayer.querySelectorAll('.login-link').forEach(link => {
  link.addEventListener('click', () => switchMode(link.dataset.switch));
});

// 启动：默认进登录板块的「邀请码」页
showLoginMode(mode);
updateStage();
requestAnimationFrame(tick);

window.addEventListener('message', (e) => {
  if (e.data === 'arc') document.querySelector('[data-page="arc"]').click();
  else if (e.data === 'fill') document.querySelector('[data-page="fill"]').click();
  else if (e.data === 'history') document.querySelector('[data-page="history"]').click();
  else if (e.data === 'reset') document.querySelector('[data-action="reset"]').click();
});
</script>
