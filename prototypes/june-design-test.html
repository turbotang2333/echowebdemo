<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>回响弧 · 交互测试</title>
<style>
:root {
  --bg: #1a1a2e; --phone-bg: #070811; --nav-w: 200px; --sat: env(safe-area-inset-top, 0px);
  /* 字体策略：宋体管"故事内容"（旁白/对话/历史），黑体管"系统语言"（UI 标签/操作提示）。*/
  --serif: 'Source Han Serif SC VF', 'Source Han Serif SC', 'Songti SC', 'STSong', serif;
  --sans:  'Source Han Sans CN', 'Source Han Sans SC', 'PingFang SC', 'HarmonyOS Sans SC', sans-serif;
}
/* 让自定义属性可被 transition / animation 插值（气泡压栈、入场、呼吸各管各的） */
@property --stack-shift { syntax: '<length>'; initial-value: 0px; inherits: false; }
@property --enter-y     { syntax: '<length>'; initial-value: 0px; inherits: false; }
@property --breath-y    { syntax: '<length>'; initial-value: 0px; inherits: false; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  overflow: hidden;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  font-family: var(--sans);
  color: rgba(255,235,210,0.9);
}

/* ============ 桌面布局 ============ */
.desktop-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%; height: 100%;
  gap: 32px;
}

/* ---- 导航面板 ---- */
.nav-panel {
  width: var(--nav-w);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-l1 {
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.1em;
  color: rgba(255,235,210,0.45);
  padding: 0 10px 4px; margin-top: 16px;
}
.nav-l1:first-child { margin-top: 0; }
.nav-l2 {
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.08em;
  color: rgba(255,235,210,0.25);
  padding: 6px 10px 3px 18px;
}
.nav-item {
  padding: 7px 10px 7px 26px; border-radius: 6px;
  font-size: 13px; color: rgba(255,235,210,0.5);
  cursor: pointer; transition: background 0.2s, color 0.2s;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
}
.nav-item:hover { background: rgba(255,235,210,0.06); color: rgba(255,235,210,0.7); }
.nav-item.active { background: rgba(255,200,130,0.12); color: rgba(255,235,210,0.9); }
.nav-item.disabled { color: rgba(255,235,210,0.2); cursor: default; pointer-events: none; }
.badge-done { font-size:10px; padding:1px 6px; border-radius:4px; background:rgba(80,200,120,0.15); color:rgba(80,200,120,0.7); flex-shrink:0; }
.badge-pending { font-size:10px; padding:1px 6px; border-radius:4px; background:rgba(255,235,210,0.06); color:rgba(255,235,210,0.2); flex-shrink:0; }
.nav-divider { height:1px; background:rgba(255,235,210,0.08); margin:10px 10px; }
.nav-action { padding:7px 10px; margin-top:4px; border-radius:6px; font-size:12px; color:rgba(255,235,210,0.35); cursor:pointer; transition:background 0.2s,color 0.2s; }
.nav-action:hover { background:rgba(255,235,210,0.06); color:rgba(255,235,210,0.5); }

/* ---- 手机框 ---- */
.phone-frame {
  height: 95vh; aspect-ratio: 1260 / 2800; border-radius: 0;
  background: var(--phone-bg); position: relative; overflow: hidden;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 20px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.04);
  flex-shrink: 0;
}
.phone-notch { display: none; }
.phone-home { display: none; }

/* ---- 舞台 ---- */
.stage { position:absolute; inset:0; overflow:hidden; touch-action:none; }

/* 场景 & 角色（canvas 之下） */
.scene-bg {
  position:absolute; inset:0; z-index:0;
  background: url('../src/images/cj5.jpg') center/cover no-repeat;
  opacity: 0; transition: opacity 0.8s ease;
}
.scene-bg.visible { opacity: 1; }
.character {
  position:absolute; z-index:1;
  left:calc(50% - 50vh); top:5%;
  width:100vh; height:100vh;
  transform: translateY(15vh) scale(0.7);
  transform-origin: 50% 20%;
  pointer-events:none;
  opacity: 0; transition: opacity 0.8s ease;
}
.character.visible { opacity: 1; }
.character img {
  width:100%; height:100%;
  object-fit:contain; object-position:center bottom;
}

/* 用户输入引导期间：全屏均匀压暗，让场景+角色统一退到暗背景，弧形/光晕浮在前景。
   引导完成后随场景图/角色一起淡出。 */
.arc-tutorial-bg-mask {
  position: absolute; inset: 0;
  z-index: 3; pointer-events: none;
  background: rgba(0, 0, 0, 0.85);
  opacity: 0; transition: opacity 0.8s ease;
}
.arc-tutorial-bg-mask.visible { opacity: 1; }

canvas { position:absolute; inset:0; width:100%; height:100%; }
/* 层级：历史(1000+) > 用户输入层(弧/光晕/提示, 4-16) > 引导暗罩(3) > 文字层(气泡 2 / 旁白 2) > 角色立绘 / 场景图
   气泡和旁白都在暗罩(z 3)之下：引导启动时整组内容跟场景+角色一起被压暗，弧/光晕浮在前景。 */
#c-glow { z-index:4; }
#c { z-index:5; }

/* ---- 引导文字 ---- */
.tutorial-text-el { position:absolute; left:0; right:0; bottom:8%; text-align:center; font-size:calc(14 * var(--u)); letter-spacing:0.18em; color:rgba(255,235,210,0.45); pointer-events:none; z-index:16; opacity:0; }
.tutorial-text-fill { bottom:25%; }
/* arc tab 的引导文字：加粗 + 微凉纯白 + 紧贴笔画的暗色软阴影描边。字本体已结实，靠两层短半径暗晕勾出轮廓，
   把字从暖金雾里"描"出来，不糊、不带方向、不引入任何形状。 */
.tutorial-text-arc {
  color: rgba(250,252,255,1);   /* 微凉纯白 */
  font-weight: 700;             /* 中文小字最高杠杆的可读性手段——笔画结实 */
  text-shadow:
    0 0 1.5px rgba(0,0,0,0.9),  /* 内圈：紧贴笔画的深色衣领，定义清晰轮廓 */
    0 0 3px   rgba(0,0,0,0.5);  /* 外圈：稍远一档的散晕，让暗色和背景平滑过渡，不显贴纸感 */
}

/* ---- 打字层：输入条 + 发送按钮，靠真实系统键盘抬高（移动端 visualViewport.height 变化写到 --kb-inset） ---- */
/* 注意：input 不能用 display:none 切显隐，否则 iOS Safari 首次 focus() 不弹键盘——
   始终保持 input 在 layout 树里，靠 opacity + pointer-events 控显隐。 */
.typing-layer { position:absolute; inset:0; z-index:20; pointer-events:none; }
/* 输入条 = 拉长版用户气泡：沿用 .bubble-user 同款墨纸介质（暖棕底 + 白字 + 外阴影 + 文字阴影），
   做成横向胶囊形（border-radius = height/2），让"敲字"和"成气泡"是同一容器在变形 */
.typing-input {
  position:absolute; left:calc(24 * var(--u)); right:calc(64 * var(--u));  /* 给右侧 36 宽 + 14 边距的发送按钮留位 */
  bottom:calc(14 * var(--u) + var(--kb-inset, 0px));
  height:calc(38 * var(--u)); padding:0 calc(18 * var(--u));
  background:rgba(40,30,22,0.85);                        /* 同 .bubble-user：暖墨棕（深一档，输入态字更立） */
  border:none; outline:none;
  border-radius:calc(19 * var(--u));                     /* height/2 → 胶囊圆头 */
  color:rgba(255,255,255,1);
  caret-color:rgba(255,255,255,1);                       /* 显式锁死白色光标，避开系统主题色 */
  text-shadow:0 1px 2px rgba(0,0,0,0.7);                 /* 同 .bubble-user：文字阴影 */
  box-shadow:0 0 18px rgba(0,0,0,0.42);                  /* 同 .bubble-user：外发光，在暗背景上自托立体 */
  text-align:center;                                     /* 光标在中心起跳，输入时文字向两边对称扩展 */
  font-family: var(--serif);
  font-size:calc(16 * var(--u)); letter-spacing:0.05em;  /* 跟气泡同字号，发送瞬间无视觉跳变 */
  pointer-events:none;                                  /* 默认不接 tap，避免抢误触 */
  opacity:0; transition:opacity 0.22s ease;             /* bottom 不做过渡：让 OS 键盘动画唯一驱动视觉连续 */
}
.typing-input::placeholder { color:rgba(255,255,255,0.35); font-style:italic; }
.typing-input::-webkit-input-placeholder { color:rgba(255,255,255,0.35); font-style:italic; }
/* 发送按钮：墨纸 disc 包 ▲，激活时图底反转——
   非激活：深 disc + 半亮 ▲（▲ 是亮焦点，等待你给它点亮）
   激活：disc 整个亮起到 100%，▲ 反转成深色剪影（颜色翻转，光从▲扩散到整个 disc，▲ 反过来成暗剪影）。
   去掉了圆环和水波脉冲——disc 本身即圆、点亮本身即反馈，简洁两态足矣。 */
.typing-send {
  position:absolute; right:calc(14 * var(--u));
  bottom:calc(14 * var(--u) + var(--kb-inset, 0px));
  width:calc(38 * var(--u)); height:calc(38 * var(--u)); padding:0; /* 正圆 disc，对齐胶囊高度 */
  display:flex; align-items:center; justify-content:center;
  border:none;
  background:rgba(20,15,8,0.85);                          /* 非激活：深一档暖墨棕（比胶囊深，等被点亮） */
  border-radius:50%;
  box-shadow:0 0 18px rgba(0,0,0,0.42);                   /* 同款外发光 */
  cursor:default;
  pointer-events:none;
  opacity:0; transition:opacity 0.22s ease, background-color 0.22s ease;
}
.typing-send svg { display:block; overflow:visible; }
.typing-send .send-core {
  fill:rgba(255,235,210,0.5);                             /* 非激活：暖白半亮 ▲，深 disc 上的"亮焦点" */
  transition:fill 0.22s ease;
}
.typing-layer.entered .typing-input { opacity:1; pointer-events:auto; }
.typing-layer.entered .typing-send { opacity:1; }
.typing-layer.entered .typing-send.active {
  background:rgba(255,235,210,1);                         /* 激活：disc 点亮到 100% 暖白 */
  cursor:pointer;
  pointer-events:auto;
}
.typing-layer.entered .typing-send.active .send-core {
  fill:rgba(20,15,8,1);                                   /* 激活：▲ 反转成深色剪影（颜色翻转） */
}

/* ---- 左上角锚点（始终可见）：跟打字发送按钮同款视觉 —— 外圈 + 中心点 + 双圈慢脉冲
       4 秒一波 + 错相 2 秒，节奏接近原呼吸但形式换成水波。
       面板打开后脉冲停、中心点淡掉、::after 画三角 ▽ 表示"可收回"。 ---- */
.history-anchor {
  position: absolute;
  top: calc(18 * var(--u) + var(--sat)); left: calc(18 * var(--u));
  width: calc(28 * var(--u)); height: calc(28 * var(--u));
  z-index: 1010;
  cursor: pointer;
  color: rgba(255, 225, 200, 0.85);                /* SVG 子元素靠 currentColor 取色 */
}
.history-anchor svg { display: block; width: 100%; height: 100%; overflow: visible; }
.history-anchor .anchor-ring  { stroke: currentColor; fill: none; }
.history-anchor .anchor-core  { fill: currentColor; transition: opacity 0.3s; }
.history-anchor .anchor-pulse { stroke: currentColor; fill: none; opacity: 0; }
.history-anchor .anchor-pulse-1 { animation: anchorPulseWave 4s ease-out infinite; }
.history-anchor .anchor-pulse-2 { animation: anchorPulseWave 4s ease-out infinite; animation-delay: 2s; }
@keyframes anchorPulseWave {
  0%   { r: 2;  opacity: 0.75; }
  100% { r: 10; opacity: 0; }
}
.history-anchor.panel-open .anchor-pulse { animation: none; opacity: 0; }
.history-anchor.panel-open .anchor-core  { opacity: 0; }
.history-anchor.panel-open::after {
  content: '';
  position: absolute;
  top: calc(9 * var(--u)); left: calc(9 * var(--u));
  width: calc(10 * var(--u)); height: calc(10 * var(--u));
  background: #6e5b3a;
  clip-path: polygon(50% 0%, 0% 86.6%, 100% 86.6%);
}
/* 文字层：用户每完成一次交互（语音/打字/上滑）触发一次的"放大→缩回"提示；
   首次点过锚点后不再触发（由 JS 控制添加/移除）。
   作用在容器上，整体连同里面的 SVG 一起弹一下。 */
.history-anchor.hint-pulse {
  animation: anchorHintPulse 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
  transform-origin: center;
}
@keyframes anchorHintPulse {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.55); }
  100% { transform: scale(1); }
}

/* ---- 历史面板（浅纸版）
   结构：
     .history-dim   底层暗幕，整屏覆盖，盖住舞台/人物 —— 不受 setMask 影响。
     .history-panel 浅纸层，整屏 + 纯色纸面背景，由 JS 的 setMask 剪成弧形。
                    mask 圆外的区域透明 → 露出下面的 dim。
   注意：padding 用 px，不要 vw/vh —— 手机框是固定 390x844，vw/vh 跟浏览器窗口走会失真。 */
.history-dim {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 999;
  background: rgba(7, 8, 17, 0.85);
  pointer-events: none;
  opacity: 0;
  display: none;
  transition: opacity 0.4s ease;
}
.history-panel {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 1000;
  background: rgb(238, 228, 210);
  pointer-events: none;
  opacity: 0;
  display: none;
}
.history-scroll {
  position: absolute;
  top: calc(52 * var(--u) + var(--sat)); left: 0; right: 0; bottom: 26%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  padding: calc(16 * var(--u)) calc(32 * var(--u)) calc(32 * var(--u));
  font-family: var(--serif);
  color: #2a2218;
  line-height: 1.8;
  letter-spacing: 0.06em;
  /* 底部渐隐进暗区，避免最后一行被硬切 */
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 85%, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 0%, #000 85%, transparent 100%);
}
.history-scroll::-webkit-scrollbar { width: 3px; }
.history-scroll::-webkit-scrollbar-thumb { background: rgba(110,91,58,0.3); border-radius: 2px; }

/* 底部"点击空白处收回"提示：跟 demo 完全一致的样式（黑体细字、字距大、暖白半透明）。
   z-index 高于 panel，落在底部暗区上；pointer-events:none 让点击穿透到 stage 触发关闭。
   入场延迟 0.25s 出现（等弧形先展开），出场立即淡出。 */
.history-hint {
  position: absolute;
  left: 0; right: 0; bottom: calc(40 * var(--u));
  z-index: 1001;
  text-align: center;
  font-family: var(--sans);
  font-size: calc(11 * var(--u));
  color: rgba(255, 235, 210, 0.55);
  letter-spacing: 0.3em;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.history-hint.visible {
  opacity: 1;
  transition: opacity 0.4s ease 0.25s;
}
/* 块间距：所有条目（对话块 / 旁白块）之间统一用这个大间距，每一块都是独立单位 */
.history-entry { margin: calc(26 * var(--u)) 0; }
.history-entry:first-child { margin-top: 0; }
.history-entry:last-child { margin-bottom: 0; }

/* Weight 二档体系（避开变体字体依赖，几乎所有中文字体都有 400/700 这两档实体字模）：
     旁白 400 (Regular)      — 跟"对话/说话人"靠颜色拉开
     对话正文 + 说话人 700 (Bold) — 真粗体，所有设备都看得到
   节奏靠颜色（旁白淡棕 / 对话深墨棕）+ 粗细（旁白 400 / 对话 700）双轨拉对比。 */

/* 旁白 + 动作旁白合并 */
.h-narration {
  color: #a08c66;
  font-style: italic;
  font-weight: 400;
  font-size: calc(14 * var(--u));
  padding-left: 1.5em;
}

/* 对话两行结构：
     第一行 .h-speaker  说话人 + 冒号（块小标题）
     第二行 .h-dialogue-text  正文（视觉焦点）
   关键：说话人 line-height 1.3，跟正文紧贴；块间距 26px → 块内:块间 ≈ 1:3 */
.h-dialogue .h-speaker {
  display: block;
  font-size: calc(14 * var(--u));
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 0;
  letter-spacing: 0.04em;
}
.h-dialogue.h-speaker-you .h-speaker { color: #6e5b3a; }
.h-dialogue.h-speaker-him .h-speaker { color: #8a7245; }
.h-dialogue-text {
  font-size: calc(15 * var(--u));
  font-weight: 700;
  padding-left: 1.5em;
  color: #2a2218;
}

/* ---- 移动端 ---- */
.menu-toggle {
  display:none; position:fixed; top:calc(12px + var(--sat)); left:50%; transform:translateX(-50%);
  z-index:500; width:40px; height:40px; border-radius:10px; border:none;
  background:rgba(255,235,210,0.08); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  cursor:pointer; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:0;
}
.menu-toggle span { display:block; width:18px; height:1.5px; background:rgba(255,235,210,0.6); border-radius:1px; transition:transform 0.3s,opacity 0.3s; }
.menu-toggle.open span:nth-child(1) { transform:translateY(6.5px) rotate(45deg); }
.menu-toggle.open span:nth-child(2) { opacity:0; }
.menu-toggle.open span:nth-child(3) { transform:translateY(-6.5px) rotate(-45deg); }
.drawer-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:300; opacity:0; pointer-events:none; transition:opacity 0.3s; }
.drawer-backdrop.visible { opacity:1; pointer-events:auto; }
.drawer { display:none; position:fixed; top:0; left:0; bottom:0; width:240px; background:rgba(20,20,40,0.95); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); z-index:400; padding:68px 16px 24px; overflow-y:auto; transform:translateX(-100%); transition:transform 0.3s cubic-bezier(0.4,0,0.2,1); }
.drawer.open { transform:translateX(0); }

/* ---- 历史面板打开期间：主屏所有"会冒新内容"的层临时藏起来，避免穿帮 ---- */
.stage.main-stage-frozen .narration-zone,
.stage.main-stage-frozen .bubble-zone,
.stage.main-stage-frozen #tutorial-text-arc,
.stage.main-stage-frozen #tutorial-text-fill {
  opacity: 0 !important;
  transition: opacity 0.25s ease !important;
}

/* ---- 文字层 ⑨：旁白 / 角色动作（narration-zone）+ 对话气泡（bubble-zone） ---- */
/* ④ 固定中心线：容器中心永远锚在屏幕从上 70% 处，内容以此为中心向上下两边对称展开 */
.narration-zone {
  position:absolute; left:50%; top:70%; width:88%;
  transform:translate(-50%, -50%);
  text-align:center; z-index:2; pointer-events:none;
}
.narration {
  display:inline-block; position:relative; max-width:100%; margin:0;
  font-family: var(--serif); font-style:italic; font-weight:300;
  font-size:calc(14 * var(--u)); line-height:1.8; letter-spacing:0.06em;
  color:rgba(255,240,215,0.92);
  text-shadow:0 0 6px rgba(0,0,0,0.85), 0 1px 0 rgba(0,0,0,0.6);
  opacity:0; transition:opacity 0.7s ease, filter 0.25s ease; z-index:0;
}
.narration.visible { opacity:1; }
/* 角色动作：偏蓝紫的白（他的主题色），跟旁白的香槟金和用户气泡的纯白区分 */
.narration.narration-action { color:rgba(195,210,255,0.96); }
/* ⑤ 暗带：本体加厚到 0.78，上下用渐变羽化融入画面 */
.narration.line-banner:not(:empty)::before {
  content:''; position:absolute; left:-50vw; right:-50vw;
  top:calc(-20 * var(--u)); bottom:auto; height:var(--banner-h, 0);
  background:linear-gradient(to bottom,
    rgba(6,6,12,0) 0,
    rgba(6,6,12,0.78) calc(14 * var(--u)),
    rgba(6,6,12,0.78) calc(100% - 14 * var(--u)),
    rgba(6,6,12,0) 100%);
  z-index:-1; pointer-events:none;
  transition:height 0.55s cubic-bezier(0.22,0.61,0.36,1);
}
.gen-chunk { display:inline; }
.gen-chunk.pending { opacity:0; }
.gen-chunk.reveal {
  opacity:1; animation:chunkRise 0.7s ease forwards;
}
@keyframes chunkRise {
  from { opacity:0; transform:translateY(calc(4 * var(--u))); filter:blur(2px); }
  to   { opacity:1; transform:translateY(0);   filter:blur(0); }
}
.narration.drifting { animation:narrDrift 1s ease forwards; }
@keyframes narrDrift {
  from { opacity:1; transform:translateY(0); }
  to   { opacity:0; transform:translateY(calc(-14 * var(--u))); }
}

/* ① 气泡 · 暖灰墨纸：跟历史面板共用一种介质；底色明显，靠文字色区分说话人 */
.bubble-zone { position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
.bubble {
  /* 设计规范：宽度跟随内容（max-content），上限 286 → 触顶换 2 行，内容区 254 → 15 字/行 → 2 行 30 字容量。
     后端单句硬上限 30 字，刚好触顶填满 2 行。min-width 80 兜底极短文本。基准 844pt 设计稿，随 --u 等比缩放。 */
  position:absolute; width:max-content; max-width:calc(286 * var(--u)); min-width:calc(80 * var(--u));
  --stack-shift: 0px;
  --enter-y: 0px;
  --breath-y: 0px;
  transform: translate(-50%, calc(var(--stack-shift) + var(--enter-y) + var(--breath-y)));
  padding:calc(10 * var(--u)) calc(16 * var(--u)); border-radius:calc(18 * var(--u));
  font-family: var(--serif); font-size:calc(16 * var(--u)); line-height:1.5; font-weight:400;
  letter-spacing:0.05em; text-align:center; white-space:normal;
  /* 三个变量各自插值，互不打架；transform 由 calc 实时合成 */
  opacity:0; transition: --stack-shift 0.45s ease, --enter-y 0.45s ease, opacity 0.45s ease, filter 0.25s ease;
}
.bubble.visible { opacity:1; }
.bubble.bubble-char { --enter-y: calc(28 * var(--u)); }
.bubble.bubble-char.settled { --enter-y: 0px; }
/* 呼吸：上下浮动 ±0/-3，周期 4.2s（和底部弧 arcBreathPeriod 同源），相位错开靠各气泡 .settled 加 class 的时差自然形成 */
.bubble.bubble-char.settled:not(.drifting) { animation: bubbleBreath 4.2s ease-in-out infinite; }
@keyframes bubbleBreath {
  0%, 100% { --breath-y: 0px; }
  50%      { --breath-y: calc(-3 * var(--u)); }
}
/* 用户气泡走 inline transform（slide-in），保留 transform transition */
.bubble.bubble-user { transition: opacity 0.45s ease, transform 0.5s ease; }
/* 用户输入暂态（点击打字 / 长按语音）把旁白 + 角色气泡压暗一档：
   filter 与 inline opacity 相乘，保留栈衰减层级；摘掉本类后 filter 经 base 的 transition 自然回到 none，无需 save/restore */
.bubble.dimmed-for-recording,
.narration.dimmed-for-recording {
  filter: opacity(0.5);
}
.bubble-char {
  color:rgba(195,210,255,0.96);
  background:rgba(30,28,38,0.85);
  box-shadow:0 0 18px rgba(0,0,0,0.42);
  text-shadow:0 1px 2px rgba(0,0,0,0.7);
}
.bubble-user {
  color:rgba(255,255,255,1);
  background:rgba(40,30,22,0.85);
  box-shadow:0 0 18px rgba(0,0,0,0.42);
  text-shadow:0 1px 2px rgba(0,0,0,0.7);
}
.bubble.drifting { animation:bubbleDrift 1s ease forwards; }
@keyframes bubbleDrift {
  from { opacity:0.85; transform:translate(-50%, var(--stack-shift, 0px)); filter:blur(0); }
  to   { opacity:0;    transform:translate(-50%, calc(var(--stack-shift, 0px) - 14 * var(--u))); filter:blur(0.8px); }
}

/* ============ 登录板块 · 方案 Y：暖灰墨纸承载 ============
   一张暖灰墨纸（沿用历史面板那张纸的色 rgb(238,228,210)）从黑底上浮出。
   纸边缘四向羽化、消融到黑里——不是矩形，是有机形状。
   纸上一切元素都用宋体 + 深墨色（#2a2218 / #6e5b3a / #8a7245，跟历史面板说话人色同源）。
   背景黑底底部仍画一条真回响弧（暖白、呼吸），跟纸面形成"光 与 纸"的对比。 */
.login-layer {
  position: absolute; inset: 0;
  z-index: 50;
  display: none;
  background: transparent;
  pointer-events: auto;
}
.login-layer.visible { display: block; }
/* 登录模式下藏掉左上角的历史锚点 + 打字层（保留 canvas 让 tick 画底部弧） */
.login-layer.visible ~ .history-anchor,
.login-layer.visible ~ .history-dim,
.login-layer.visible ~ .history-panel,
.login-layer.visible ~ .history-hint,
.login-layer.visible ~ .typing-layer { display: none !important; }

/* 纸面：暖灰墨纸 + 椭圆 mask 边缘羽化 + drop-shadow 给一点重量
   不在 ::before 里做，独立一层以便 filter 不波及内容文字 */
.login-paper {
  position: absolute;
  top: 47%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 92%;
  max-width: calc(380 * var(--u));
  height: calc(460 * var(--u));
  background: rgb(238, 228, 210);
  /* 椭圆 mask 把四边羽化掉——视觉上纸是一团从黑底里"晕"出来的形状，不是矩形 */
  -webkit-mask-image: radial-gradient(ellipse 70% 64% at 50% 50%,
    rgba(0,0,0,1)   28%,
    rgba(0,0,0,0.88) 52%,
    rgba(0,0,0,0.42) 78%,
    rgba(0,0,0,0)   100%);
          mask-image: radial-gradient(ellipse 70% 64% at 50% 50%,
    rgba(0,0,0,1)   28%,
    rgba(0,0,0,0.88) 52%,
    rgba(0,0,0,0.42) 78%,
    rgba(0,0,0,0)   100%);
  /* drop-shadow 跟随 mask 的 alpha 形状，给纸一点漂浮的"重量" */
  filter: drop-shadow(0 calc(8 * var(--u)) calc(36 * var(--u)) rgba(0, 0, 0, 0.55));
  pointer-events: none;
  animation: paperFloatIn 0.85s cubic-bezier(0.22, 0.61, 0.36, 1);
}
@keyframes paperFloatIn {
  from { opacity: 0; transform: translate(-50%, -45%) scale(0.97); }
  to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* 内容容器：跟纸面同心，宽度小一圈（让文字坐在纸的"安全区"里） */
.login-card {
  position: absolute;
  top: 47%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 70%;
  max-width: calc(280 * var(--u));
}

/* 三个子页：同区域叠放；display 控显隐，opacity 控淡入淡出 */
.login-page {
  display: none;
  flex-direction: column;
  align-items: stretch;
  gap: calc(20 * var(--u));
  opacity: 0;
  transition: opacity 0.3s ease;
}
.login-page.active { display: flex; }
.login-page.entered { opacity: 1; }

/* 标题：宋体 + 深墨色，像翻开一本旧书的扉页 */
.login-title {
  font-family: var(--serif);
  font-size: calc(26 * var(--u));
  font-weight: 400;
  letter-spacing: 0.2em;
  text-indent: 0.2em;
  text-align: center;
  color: #2a2218;
  margin-bottom: calc(4 * var(--u));
}
/* 引导小字：宋体斜体 + 浅墨棕（沿用历史面板 h-narration 色） */
.login-hint {
  font-family: var(--serif);
  font-style: italic;
  font-size: calc(13 * var(--u));
  letter-spacing: 0.04em;
  text-align: center;
  color: #a08c66;
  margin-bottom: calc(6 * var(--u));
}

/* 输入框：纸上一条深墨色细线（左右两端淡出消融到纸里）
   字色深墨 #2a2218、宋体；下划线初始用 #6e5b3a 半透，聚焦时换 #2a2218 全墨 */
.login-input {
  display: block;
  width: 100%;
  height: calc(40 * var(--u));
  padding: 0 calc(6 * var(--u));
  background-color: transparent;
  background-image: linear-gradient(to right,
    rgba(110, 91, 58, 0)    0%,
    rgba(110, 91, 58, 0.5)  22%,
    rgba(110, 91, 58, 0.5)  78%,
    rgba(110, 91, 58, 0)   100%);
  background-repeat: no-repeat;
  background-size: 100% 1px;
  background-position: 50% 100%;
  border: none;
  outline: none;
  color: #2a2218;
  caret-color: #2a2218;
  font-family: var(--serif);
  font-size: calc(16 * var(--u));
  letter-spacing: 0.05em;
  text-align: center;
  transition: background-image 0.25s, transform 0.05s;
}
.login-input::placeholder { color: rgba(110, 91, 58, 0.45); font-style: italic; letter-spacing: 0.06em; }
.login-input:focus {
  background-image: linear-gradient(to right,
    rgba(42, 34, 24, 0)    0%,
    rgba(42, 34, 24, 0.85) 22%,
    rgba(42, 34, 24, 0.85) 78%,
    rgba(42, 34, 24, 0)   100%);
}
.login-input.shake { animation: loginShake 0.32s ease-in-out; }
@keyframes loginShake {
  0%, 100% { transform: translateX(0); }
  20%      { transform: translateX(calc(-5 * var(--u))); }
  40%      { transform: translateX(calc(5 * var(--u))); }
  60%      { transform: translateX(calc(-4 * var(--u))); }
  80%      { transform: translateX(calc(3 * var(--u))); }
}

/* 输入框 + 右贴"获取验证码"小按钮 */
.login-input-row { display: flex; gap: calc(6 * var(--u)); align-items: flex-end; }
.login-input-row .login-input { flex: 1; }
.login-mini-btn {
  flex-shrink: 0;
  height: calc(40 * var(--u));
  padding: 0 calc(6 * var(--u));
  background: transparent;
  border: none;
  outline: none;
  color: rgba(110, 91, 58, 0.7);
  font-family: var(--serif);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: color 0.2s;
  white-space: nowrap;
}
.login-mini-btn:hover:not(:disabled) { color: #2a2218; }
.login-mini-btn:disabled { color: rgba(110, 91, 58, 0.3); cursor: default; }

/* 主按钮：纸上一段宋体墨字 + 下方一条短墨线；激活时墨色变深、墨线变实 */
.login-btn {
  position: relative;
  align-self: center;
  margin-top: calc(20 * var(--u));
  padding: calc(8 * var(--u)) calc(36 * var(--u));
  background-color: transparent;
  background-image: linear-gradient(to right,
    rgba(110, 91, 58, 0)    0%,
    rgba(110, 91, 58, 0.4) 30%,
    rgba(110, 91, 58, 0.4) 70%,
    rgba(110, 91, 58, 0)   100%);
  background-repeat: no-repeat;
  background-size: 60% 1px;
  background-position: 50% 100%;
  border: none;
  outline: none;
  color: rgba(110, 91, 58, 0.7);
  font-family: var(--serif);
  font-size: calc(17 * var(--u));
  font-weight: 400;
  letter-spacing: 0.35em;
  text-indent: 0.35em;
  cursor: pointer;
  transition: color 0.3s, background-image 0.3s, transform 0.1s;
}
.login-btn.active {
  color: #2a2218;
  background-image: linear-gradient(to right,
    rgba(42, 34, 24, 0)    0%,
    rgba(42, 34, 24, 0.85) 30%,
    rgba(42, 34, 24, 0.85) 70%,
    rgba(42, 34, 24, 0)   100%);
  background-size: 70% 1px;
}
.login-btn:active.active { transform: translateY(1px); }

/* 点击瞬间：从中心向外发散一圈墨色光涟漪 */
.login-btn .btn-flare {
  position: absolute; left: 50%; top: 50%;
  width: 0; height: 0;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(110, 91, 58, 0.35) 0%,
    rgba(110, 91, 58, 0.12) 40%,
    rgba(110, 91, 58, 0)    78%);
  transform: translate(-50%, -50%);
  pointer-events: none;
  opacity: 0;
}
.login-btn .btn-label { position: relative; z-index: 1; }
.login-btn.flaring .btn-flare { animation: loginBtnFlare 0.7s ease-out; }
@keyframes loginBtnFlare {
  0%   { width: calc(20 * var(--u));  height: calc(20 * var(--u));  opacity: 0.85; }
  100% { width: calc(220 * var(--u)); height: calc(90 * var(--u));  opacity: 0; }
}

.login-link {
  margin-top: calc(8 * var(--u));
  font-family: var(--serif);
  font-style: italic;
  font-size: calc(13 * var(--u));
  letter-spacing: 0.04em;
  text-align: center;
  color: rgba(110, 91, 58, 0.65);
  cursor: pointer;
  transition: color 0.2s;
}
.login-link:hover { color: #2a2218; }

.login-error {
  min-height: calc(16 * var(--u));
  margin-top: calc(-12 * var(--u));
  font-family: var(--serif);
  font-style: italic;
  font-size: calc(12 * var(--u));
  letter-spacing: 0.04em;
  text-align: center;
  color: #8a4a3a;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.login-error.visible { opacity: 1; }

@media (max-width: 768px) {
  :root { --bg: #070811; }
  .desktop-wrap { display:block; width:100%; height:100%; }
  .desktop-wrap > .nav-panel { display:none; }
  .phone-frame { width:100%; height:100%; border-radius:0; box-shadow:none; }
  .phone-notch, .phone-home { display:none; }
  .menu-toggle { display:flex; }
  .drawer-backdrop { display:block; }
  .drawer { display:block; }
  .drawer .nav-panel { width:100%; }
  .drawer .nav-item { padding:10px 10px 10px 26px; }
}
</style>
</head>
<body>

<button class="menu-toggle" id="menu-toggle"><span></span><span></span><span></span></button>
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="drawer" id="drawer">
  <div class="nav-panel" id="drawer-nav"></div>
</div>

<div class="desktop-wrap">
  <div class="nav-panel" id="desktop-nav"></div>

  <div class="phone-frame" id="phone">
    <div class="phone-notch"></div>
    <div class="phone-home"></div>
    <div class="stage" id="stage">
      <div class="scene-bg"></div>
      <div class="character"><img src="../src/images/xiaohuli.png" alt=""></div>
      <div class="arc-tutorial-bg-mask" id="arc-tutorial-bg-mask"></div>
      <div class="narration-zone" id="narration-zone"></div>
      <div class="bubble-zone" id="bubble-zone"></div>
      <canvas id="c-glow"></canvas>
      <canvas id="c"></canvas>
      <div class="tutorial-text-el tutorial-text-arc" id="tutorial-text-arc">长按区域，语音输入</div>
      <div class="tutorial-text-el tutorial-text-fill" id="tutorial-text-fill">上滑推进</div>

      <!-- 登录板块：方案 Y · 暖灰墨纸承载（纸面是独立背景层，文字在 card 里） -->
      <div class="login-layer" id="login-layer">
        <div class="login-paper"></div>
        <div class="login-card">
          <!-- 邀请码页 -->
          <div class="login-page login-page-invite active entered" data-page="login-invite">

      <!-- 打字层：输入条 + 发送按钮；不再带假键盘，靠真实系统键盘抬起 -->

          <circle class="anchor-ring"                cx="12" cy="12" r="10" stroke-width="1.4"/>
          <circle class="anchor-pulse anchor-pulse-1" cx="12" cy="12" r="2"  stroke-width="1"/>
          <circle class="anchor-pulse anchor-pulse-2" cx="12" cy="12" r="2"  stroke-width="1"/>

<script>
// ============================================================
// 数据 + 渲染（导航 / 历史剧情）
// ============================================================
// 改 nav：只动这个数组。type=l1/l2 是分组标题，item 是可点项，
// disabled 不可点；status=done|pending 决定徽章；page 用于高亮，mode 触发 switchMode。
const NAV_ITEMS = [
  { type: 'l1', label: '登录' },
  { type: 'item', page: 'login-invite',   mode: 'login-invite',   label: '邀请码',       status: 'done', active: true },
  { type: 'item', page: 'login-phone',    mode: 'login-phone',    label: '手机号验证码', status: 'done' },
  { type: 'item', page: 'login-password', mode: 'login-password', label: '账号密码',     status: 'done' },
  { type: 'l1', label: '内容流' },
  { type: 'l2', label: '交互' },
  { type: 'item', page: 'common', label: '共用原则', status: 'done', disabled: true },
  { type: 'item', page: 'arc',     mode: 'arc',     label: '用户输入', status: 'done' },
  { type: 'item', page: 'fill',    mode: 'fill',    label: '推动剧情', status: 'done' },
  { type: 'item', page: 'history', mode: 'history', label: '历史剧情', status: 'done' },
  { type: 'l2', label: '剧情表现' },
  { type: 'item', page: 'text',    mode: 'text',    label: '文字层',   status: 'done' },
  { type: 'item', label: '角色层', status: 'pending', disabled: true },
  { type: 'item', label: '场景层', status: 'pending', disabled: true },
  { type: 'item', label: '特效层', status: 'pending', disabled: true },
  { type: 'l1', label: '记忆星图' },
  { type: 'item', label: '记忆星图', status: 'pending', disabled: true },
  { type: 'divider' },
  { type: 'action', action: 'reset', label: '重置引导计数' },
];

function renderNav(container) {
  container.innerHTML = NAV_ITEMS.map(it => {
    if (it.type === 'l1')      return `<div class="nav-l1">${it.label}</div>`;
    if (it.type === 'l2')      return `<div class="nav-l2">${it.label}</div>`;
    if (it.type === 'divider') return `<div class="nav-divider"></div>`;
    if (it.type === 'action')  return `<div class="nav-action" data-action="${it.action}">${it.label}</div>`;
    const cls = ['nav-item'];
    if (it.disabled) cls.push('disabled');
    if (it.active)   cls.push('active');
    const attrs = [];
    if (it.page) attrs.push(`data-page="${it.page}"`);
    if (it.mode) attrs.push(`data-mode="${it.mode}"`);
    const badge = it.status === 'done'    ? '<span class="badge-done">已交付</span>'
                : it.status === 'pending' ? '<span class="badge-pending">待交付</span>'
                : '';
    return `<div class="${cls.join(' ')}" ${attrs.join(' ')}>${it.label} ${badge}</div>`;
  }).join('');
}

// 等比缩放基准：iPhone 14 标准设计稿高度。所有 CSS/JS 里的 px 都按 (H/BASE_H) 缩放。
const BASE_H = 844;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = phone.clientWidth; H = phone.clientHeight;
  for (const cv of [cMain, cGlow]) {
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }
  // --u：CSS 里 calc(N * var(--u)) 的单位缩放因子。
  // 桌面 95vh ≈ 1026px → u ≈ 1.215；iPhone 14 真机 844px → u = 1。
  phone.style.setProperty('--u', (H / BASE_H) + 'px');
}
window.addEventListener('resize', resize); resize();
function vw(n) { return n * W / 100; }
function vh(n) { return n * H / 100; }
function u(n)  { return n * H / BASE_H; }

// ---- 真实系统键盘适配：把当前键盘抢走的高度写入 --kb-inset，输入框 bottom 自动抬起 ----
// 桌面无键盘：inset = 0，输入框停在 phone-frame 底边上方 14px；
// 移动端键盘弹起：visualViewport.height 缩小，inset = 抢走的像素数，输入框正好停在键盘上方。
function updateKbInset() {
  const vv = window.visualViewport;
  let inset = 0;
  if (vv) {
    // 只算 innerHeight - vv.height：键盘弹起时 offsetTop 在 Android 上会因 scroll-into-view
    // 临时跳值，加进来会让 inset 中途过冲。去掉 offsetTop 后失真很小但平稳。
    inset = Math.max(0, window.innerHeight - vv.height);
  }
  document.documentElement.style.setProperty('--kb-inset', inset + 'px');
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', updateKbInset);
  window.visualViewport.addEventListener('scroll', updateKbInset);
}
window.addEventListener('resize', updateKbInset);
updateKbInset();

// ---- 统一 timer 管理 ----
let pendingTimers = [];
function scheduleGo(s, delay) {
  const id = setTimeout(() => {
    pendingTimers = pendingTimers.filter(t => t !== id);
    go(s);
  }, delay);
  pendingTimers.push(id);
}
function clearAllTimers() {
  pendingTimers.forEach(id => clearTimeout(id));
  pendingTimers = [];
}

// ---- 手势状态清理 ----
function resetGesture() {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  pressing = false; down = null; swipeProgress = 0; arcEnterAccel = false;
}

// ---- 历史面板 DOM ----
// 圆形剪裁：用 clip-path 而非 mask。
//   (1) clip-path 是几何切，边缘硬切，没有 mask 渐变带产生的"半透明浅色环"。
//   (2) clip-path 会影响 hit-testing —— 圆外区域不接收点击，点击穿透到下面的 dim/stage，
//       这样"点面板外区域关闭"才能恢复（mask 不影响点击，圆外的整块面板还是会拦截点击）。
//   fade 参数保留是为了不动调用点，clip-path 没有渐变，实际不用。
function setMask(el, r, cx, cy, fade) {
  const clip = r <= 0 ? 'circle(0)' : `circle(${r}px at ${cx}px ${cy}px)`;
  el.style.clipPath = clip;
  el.style.webkitClipPath = clip;
}
function clearMask(el) {
  el.style.clipPath = '';
  el.style.webkitClipPath = '';
}

function showHistoryPanel() {
  historyDim.style.display = 'block';
  // 强制 reflow 让 opacity 从 0 起步，下一行设 1 才会触发 transition
  void historyDim.offsetWidth;
  historyDim.style.opacity = '1';
  historyPanel.style.display = 'block';
  historyPanel.style.opacity = '1';
  historyPanel.style.pointerEvents = 'none';
  setMask(historyPanel, 0, 0, 0, 0);
  historyScroll.scrollTop = historyScroll.scrollHeight;
  historyAnchor.classList.add('panel-open');
  historyHint.classList.add('visible');
}
function hideHistoryPanel() {
  historyPanel.style.opacity = '0';
  historyPanel.style.pointerEvents = 'none';
  clearMask(historyPanel);
  historyPanel.style.display = 'none';
  historyDim.style.opacity = '0';
  historyDim.style.display = 'none';
  historyHint.classList.remove('visible');
  historyAnchor.classList.remove('panel-open');
  thawMainStage();
}

// 历史面板打开时：不打断当前正在播的内容，但藏掉视觉层避免漏进面板下方的开口；
// 同时设 _pauseAfterCurrent，让"下一步"被 maybeRunOrPause 暂存而非执行
let _pauseAfterCurrent = false;
let _pendingNextStep = null;
let _frozenState = null;     // 冻住时主屏的 state/stateT，关掉面板时还原（防止 history 状态把主屏 state 覆盖丢）

function maybeRunOrPause(fn) {
  if (_pauseAfterCurrent) { _pendingNextStep = fn; }
  else { fn(); }
}

function freezeMainStage() {
  if (!state.startsWith('history')) _frozenState = { s: state, t: stateT };
  // 杀状态机的待办（避免遗留 scheduleGo 在面板打开后覆盖 history 状态）；
  // 但**不杀**文字层 tSet 计时器——让当前正在打字/淡入的动画自然播完
  clearAllTimers();
  resetGesture();
  if (state === 'arc-record' && mode === 'text') restoreDimmedText();
  _pauseAfterCurrent = true;
  document.getElementById('stage').classList.add('main-stage-frozen');
}

function thawMainStage() {
  document.getElementById('stage').classList.remove('main-stage-frozen');
  _pauseAfterCurrent = false;
  if (_frozenState) {
    state = _frozenState.s; stateT = _frozenState.t; _frozenState = null;
  }
  if (_pendingNextStep) {
    const fn = _pendingNextStep; _pendingNextStep = null;
    fn();
  } else {
    // 没有暂存的"下一步"——按 state 做一次最小恢复
    if (state === 'arc-enter') scheduleGo('arc-invite', 1000);
    else if (state === 'fill-enter') scheduleGo('fill-idle', 1600);
  }
}

function switchMode(m) {
  if (m === mode && !historyOverlay) return;
  clearAllTimers();
  resetGesture();
  // arc tab 也带了一组叠加旁白+气泡，切走时跟 text 一样清场
  if ((mode === 'text' || mode === 'arc') && m !== 'text' && m !== 'arc') clearAllText();
  // 切走 arc tab：立即收起打字层(若仍开着)；draft 保留，回来仍可见光点
  if (mode === 'arc' && m !== 'arc') {
    if (typingLayer.classList.contains('entered')) hideTypingUI();
  }

  if (historyOverlay) { historyOverlay = false; hideHistoryPanel(); }
  if (mode === 'history' && m !== 'history') hideHistoryPanel();

  // 切到登录模式：藏掉舞台所有交互，只显示登录卡片
  if (m.startsWith('login')) {
    mode = m;
    highlightNav(m);
    updateStage();
    showLoginMode(m);
    return;
  }
  // 从登录切回 arc/fill/text：藏登录层
  if (mode.startsWith('login')) {
    hideLoginLayer();
  }

  // 记住最后的 arc/fill 模式
  if (m === 'history' && (mode === 'arc' || mode === 'fill')) prevArcFillMode = mode;

  mode = m;
  if (m === 'fill') fillCommitCount = 0;
  highlightNav(m);
  updateStage();

  if (m === 'history') {
    enterHistory();
  } else {
    enterArcFill();
  }
}

function _onExitDone() {
  hideHistoryPanel();
  // 覆盖层关闭（mode !== 'history'）：主屏在 openOverlay 时已经被冻住，
  // hideHistoryPanel 已经 thaw 视觉层，这里不再重启主屏流程——画面停留在冻住的那一刻。
  if (mode === 'history') state = 'history-closed';
}

// ---- 动画打断：从当前进度平滑反转 ----
function getHistoryVisualProgress() {
  const elapsed = (performance.now() - stateT) / 1000;
  if (state === 'history-enter') return 1 - Math.pow(1 - Math.min(1, elapsed / 0.5), 2.5);
  if (state === 'history-exit')  return Math.pow(1 - Math.min(1, elapsed / 0.35), 2);
  return state === 'history-idle' ? 1 : 0;
}

function interruptToClose() {
  const vp = getHistoryVisualProgress();
  clearAllTimers();
  resetGesture();
  historyOverlay = false;
  historyPanel.style.pointerEvents = 'none';
  historyAnchor.classList.remove('panel-open');
  historyHint.classList.remove('visible');
  historyDim.style.opacity = '0';
  document.getElementById('stage').classList.remove('main-stage-frozen');

  const exitDur = 0.35;
  const t_exit = 1 - Math.sqrt(Math.max(0.001, vp));
  state = 'history-exit';
  stateT = performance.now() - t_exit * exitDur * 1000;
  rippleTimer = 0;
  scheduleGo('_exit-done', Math.max(50, (1 - t_exit) * exitDur * 1000 + 50));
}

function interruptToOpen() {
  const vp = getHistoryVisualProgress();
  clearAllTimers();
  resetGesture();
  if (mode !== 'history') historyOverlay = true;
  showHistoryPanel();

  const enterDur = 0.5;
  const t_enter = 1 - Math.pow(Math.max(0.001, 1 - vp), 0.4);
  state = 'history-enter';
  stateT = performance.now() - t_enter * enterDur * 1000;
  rippleTimer = 0;
  scheduleGo('history-idle', Math.max(50, (1 - t_enter) * enterDur * 1000 + 50));
}

document.querySelectorAll('.nav-item[data-mode]').forEach(item => {
  item.addEventListener('click', () => { switchMode(item.dataset.mode); closeDrawer(); });
});

document.querySelectorAll('[data-action="reset"]').forEach(el => {
  el.addEventListener('click', () => {
    arcTutorialCount = 0; fillTutorialCount = 0; typingTutorialCount = 0;
    draftText = ''; hasDraft = false;
    anchorEverClicked = false;
    if (typingLayer.classList.contains('entered')) hideTypingUI();
    updateStage();
  });
});
