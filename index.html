<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0814" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>echo · 幕(竖屏版)</title>
  <link rel="preload" as="image" href="src/images/xiaohuli.png" />
  <link rel="preload" as="image" href="src/images/cj1.jpg" />
  <link rel="preload" as="image" href="src/images/cj2.jpg" />
  <link rel="preload" as="image" href="src/images/cj3.jpg" />
  <link rel="preload" as="image" href="src/images/cj4.png" />
  <link rel="preload" as="image" href="src/images/cj5.jpg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="orientation-gate">
    <p>请将设备竖置以体验</p>
  </div>

  <div id="stage" class="stage">
    <div class="stage-bg" id="stage-bg"></div>

    <div class="scene-bg" id="scene-bg" aria-hidden="true"></div>

    <div class="art-layer" id="art-layer"></div>

    <div class="character-layer" id="character-layer">
      <div class="character" id="character" aria-hidden="true">
        <div class="char-fig" id="char-fig">
          <img class="char-img" src="src/images/xiaohuli.png" alt="" draggable="false" />
        </div>
      </div>
    </div>

    <div class="anchor" id="journal-anchor" aria-label="历史锚点"></div>

    <!-- 软幕 · 触控热区在下 1/3 屏,弧在底部,长按向上展开 -->
    <div class="edge-zone" id="edge-zone">
      <div class="edge-veil" aria-hidden="true"></div>
      <div class="edge-arc-host" id="edge-arc-host">
        <svg class="edge-svg edge-svg-portrait" viewBox="0 0 1000 220" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="edge-fade-h" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"   stop-color="white" stop-opacity="0"/>
              <stop offset="20%"  stop-color="white" stop-opacity="1"/>
              <stop offset="80%"  stop-color="white" stop-opacity="1"/>
              <stop offset="100%" stop-color="white" stop-opacity="0"/>
            </linearGradient>
            <mask id="edge-mask-h">
              <rect width="1000" height="220" fill="url(#edge-fade-h)"/>
            </mask>
          </defs>
          <g mask="url(#edge-mask-h)">
            <path class="edge-arc edge-arc-main"
                  d="M 60 230 Q 500 30 940 230"
                  fill="none" stroke="rgba(255,235,210,0.7)" stroke-width="2.5"
                  stroke-linecap="round" vector-effect="non-scaling-stroke" />
          </g>
          <path class="edge-ripple ripple-1"
                d="M 60 230 Q 500 30 940 230"
                fill="none" stroke="rgba(255,235,210,0.85)" stroke-width="2.5"
                stroke-linecap="round" vector-effect="non-scaling-stroke" />
          <path class="edge-ripple ripple-2"
                d="M 60 230 Q 500 30 940 230"
                fill="none" stroke="rgba(255,235,210,0.85)" stroke-width="2.5"
                stroke-linecap="round" vector-effect="non-scaling-stroke" />
          <path class="edge-ripple ripple-3"
                d="M 60 230 Q 500 30 940 230"
                fill="none" stroke="rgba(255,235,210,0.85)" stroke-width="2.5"
                stroke-linecap="round" vector-effect="non-scaling-stroke" />
        </svg>
      </div>

      <span class="arc-guide arc-guide-left">
        <span class="guide-text guide-normal">轻触 打字</span>
        <span class="guide-text guide-action">轻触 行动</span>
      </span>
      <span class="arc-guide arc-guide-right">
        <span class="guide-text guide-normal">长按 语音（推荐）</span>
        <span class="guide-text guide-action">长按 感受（推荐）</span>
      </span>
      <span class="arc-guide arc-guide-center">
        <span class="guide-center-text">输入行动</span>
      </span>
    </div>

    <!-- 打字输入区: type-text 显示用户敲的内容(所见即所得), send-btn 提交.
         hidden-input-host 是真正接收键盘事件的离屏 input 容器. -->
    <div class="type-area" id="type-area">
      <div class="type-text" id="type-text"><span class="caret"></span></div>
      <button class="send-btn" id="send-btn" type="button" disabled aria-label="送出">
        <svg viewBox="0 0 30 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 4C5 2.89543 5.89543 2 7 2H23C24.1046 2 25 2.89543 25 4V17C25 18.1046 24.1046 19 23 19H10L5 23V4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="11" cy="10.5" r="1.2" fill="currentColor"/>
          <circle cx="15" cy="10.5" r="1.2" fill="currentColor"/>
          <circle cx="19" cy="10.5" r="1.2" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div id="hidden-input-host"></div>

    <div class="subtitle-zone" id="subtitle-zone"></div>
    <div class="bubble-zone" id="bubble-zone"></div>
    <div class="narration-zone" id="narration-zone"></div>
    <div class="inner-zone" id="inner-zone"></div>
    <div class="heavy-zone" id="heavy-zone"></div>
    <div class="npc-zone" id="npc-zone"></div>

    <div class="echo-stage" id="echo-stage" hidden>
      <div class="echo-halo" id="echo-halo">
        <div class="echo-halo-core"></div>
        <div class="echo-halo-ring"></div>
      </div>
      <div class="echo-text" id="echo-text"></div>
      <div class="echo-hints" id="echo-hints"></div>
      <button class="echo-skip" id="echo-skip" type="button" hidden>跳过</button>
    </div>

    <div class="opening-zone" id="opening-zone" hidden>
      <button class="opening-skip" id="opening-skip" type="button">跳过开场 ›</button>
      <div class="opening-glow" id="opening-glow" hidden>
        <div class="opening-glow-core"></div>
        <div class="opening-glow-hint">长按 · 唤醒</div>
      </div>
      <div class="opening-text" id="opening-text"></div>
    </div>

    <div class="run-anchor" id="run-anchor" hidden></div>

    <div class="endmark" id="endmark" hidden>
      <div class="endmark-text">第一章 完</div>
      <div class="endmark-hint" id="endmark-hint">试着从左上角拉开这一段的回忆</div>
    </div>

    <div class="blink-veil" id="blink-veil"></div>
    <div class="white-veil" id="white-veil"></div>

    <div class="journal" id="journal" hidden>
      <div class="journal-paper">
        <button class="journal-close" id="journal-close" type="button" aria-label="收回事记">
          <span class="journal-close-arrow"></span>
          <span class="journal-close-label">收回</span>
        </button>
        <div class="journal-scroll" id="journal-scroll"></div>
        <div class="journal-hint">点左上角 / 点下方空白 — 收回</div>
      </div>
    </div>

    <div class="finale" id="finale" hidden>
      <p>demo 结束</p>
      <p class="finale-sub">刷新页面可重头再来</p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
