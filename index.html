<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070811" />
  <title>Echo Web Demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #f8ead5;
      background: #070811;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .page {
      width: min(100%, 760px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 32px;
      align-items: center;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 34px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 26px;
      max-width: 420px;
      color: rgba(248, 234, 213, 0.68);
      font-size: 15px;
      line-height: 1.8;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    a {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border: 1px solid rgba(248, 234, 213, 0.22);
      border-radius: 6px;
      color: #f8ead5;
      text-decoration: none;
      font-size: 14px;
      background: rgba(248, 234, 213, 0.08);
    }
    a.primary {
      background: #f8ead5;
      color: #10101a;
      border-color: #f8ead5;
    }
    .figure {
      width: 220px;
      aspect-ratio: 1 / 1.32;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
    }
    .figure img {
      width: 142%;
      max-width: none;
      display: block;
      transform: translateY(16px);
      filter: drop-shadow(0 22px 36px rgba(0, 0, 0, 0.45));
    }
    @media (max-width: 720px) {
      body { padding: 24px; }
      .page {
        grid-template-columns: 1fr;
        gap: 22px;
        text-align: left;
      }
      .figure {
        width: min(62vw, 220px);
        order: -1;
      }
      h1 { font-size: 28px; }
      p { font-size: 14px; }
      .actions { flex-direction: column; }
      a { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section>
      <h1>Echo Web Demo</h1>
      <p>当前主要开发页面是 6 月 Demo。根目录现在只作为入口，不再承载旧 demo 页面。</p>
      <div class="actions">
        <a class="primary" href="prototypes/june-demo/">进入 6 月 Demo</a>
        <a href="plans/README.md">查看方案文档</a>
      </div>
    </section>
    <div class="figure" aria-hidden="true">
      <img src="src/images/xiaohuli.png" alt="" />
    </div>
  </main>
</body>
</html>
