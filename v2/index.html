<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070811" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>echo · v2 (短剧体验)</title>
  <link rel="preload" as="image" href="../src/images/xiaohuli.png" />
  <link rel="preload" as="image" href="../src/images/cj1.jpg" />
  <link rel="preload" as="image" href="../src/images/cj2.jpg" />
  <link rel="preload" as="image" href="../src/images/cj3.jpg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="orientation-gate" hidden>
    <p>请将设备竖置以体验</p>
  </div>

  <div id="stage" class="stage">
    <!-- 屏堆栈：当前屏在前，上滑时旧屏向上推走。每屏内只放背景。 -->
    <div class="screen-host" id="screen-host"></div>

    <!-- 全局立绘层（跨屏复用单一立绘，由场景控制 pose/位置） -->
    <div class="character-layer" id="character-layer">
      <div class="character" id="character" aria-hidden="true">
        <div class="char-fig" id="char-fig">
          <img class="char-img" src="../src/images/xiaohuli.png" alt="" draggable="false" />
        </div>
      </div>
    </div>

    <!-- 程序化特效层 -->
    <div class="fx-layer" id="fx-layer"></div>

    <!-- 旁白 / 内心 / 重旁白 / NPC 缺席旁白 / 对话气泡 — 跨屏全局，
         scene 切换由 player 主动 clearAllText() 兜底。 -->
    <div class="narration-zone" id="narration-zone"></div>
    <div class="inner-zone" id="inner-zone"></div>
    <div class="heavy-zone" id="heavy-zone"></div>
    <div class="npc-zone" id="npc-zone"></div>
    <div class="bubble-zone" id="bubble-zone"></div>

    <!-- 圆弧（屏内对话节点弹起） -->
    <div class="edge-zone" id="edge-zone" hidden>
      <div class="edge-veil" aria-hidden="true"></div>
      <div class="edge-arc-host" id="edge-arc-host">
        <svg class="edge-svg" viewBox="0 0 1000 220" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="edge-fade-h" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"   stop-color="white" stop-opacity="0"/>
              <stop offset="20%"  stop-color="white" stop-opacity="1"/>
              <stop offset="80%"  stop-color="white" stop-opacity="1"/>
              <stop offset="100%" stop-color="white" stop-opacity="0"/>
            </linearGradient>
            <mask id="edge-mask-h">
              <rect width="1000" height="220" fill="url(#edge-fade-h)"/>
            </mask>
          </defs>
          <g mask="url(#edge-mask-h)">
            <path class="edge-arc edge-arc-main"
                  d="M 60 230 Q 500 30 940 230"
                  fill="none" stroke="rgba(255,235,210,0.7)" stroke-width="2.5"
                  stroke-linecap="round" vector-effect="non-scaling-stroke" />
          </g>
          <path class="edge-ripple ripple-1"
                d="M 60 230 Q 500 30 940 230"
                fill="none" stroke="rgba(255,235,210,0.85)" stroke-width="2.5"
                stroke-linecap="round" vector-effect="non-scaling-stroke" />
          <path class="edge-ripple ripple-2"
                d="M 60 230 Q 500 30 940 230"
                fill="none" stroke="rgba(255,235,210,0.85)" stroke-width="2.5"
                stroke-linecap="round" vector-effect="non-scaling-stroke" />
          <path class="edge-ripple ripple-3"
                d="M 60 230 Q 500 30 940 230"
                fill="none" stroke="rgba(255,235,210,0.85)" stroke-width="2.5"
                stroke-linecap="round" vector-effect="non-scaling-stroke" />
        </svg>
      </div>

      <!-- 弧下方居中操作提示（前 2 次出现，与手势教学同步消失） -->
      <div class="arc-hint" id="arc-hint" aria-hidden="true">长按语音对话</div>

      <!-- 引导文字（对话提示）— 弧上方 -->
      <div class="edge-prompt" id="edge-prompt"></div>
    </div>

    <!-- 底部尖尖 — 上滑可推进剧情时显现。跟长按圆弧用完全相同的 viewBox
         和 path（M 60 230 Q 500 30 940 230），元素整体下沉到屏外，只露
         出顶端约 30px 的尖。弧线 + 弧下方实心半透填充，缓慢呼吸。
         上滑手势中弧形会跟随手指拱起；上滑成功跟旧屏一起离场，
         未达阈值则平滑回弹。 -->
    <div class="swipe-tip" id="swipe-tip" aria-hidden="true">
      <svg class="swipe-tip-svg" viewBox="0 0 1000 220" preserveAspectRatio="none">
        <path class="swipe-tip-fill"
              d="M 60 230 Q 500 30 940 230 Z" />
      </svg>
    </div>

    <!-- 触点教学指示（前 2 次出现）— 一个圆点，由 .demo-swipe / .demo-press
         切换成 上滑示范 / 长按示范 两种动画。元素始终在 DOM，靠 class 控制显隐。 -->
    <div class="touch-hint" id="touch-hint"></div>

    <!-- 左上角"剧情历史"锚点（点击展开） -->
    <div class="anchor" id="journal-anchor" aria-label="剧情历史"></div>

    <!-- 剧情历史抽屉：从顶部下展，纸面内可滚动，点击空白区域收回 -->
    <div class="journal" id="journal" hidden>
      <div class="journal-paper">
        <button class="journal-close" id="journal-close" type="button" aria-label="返回">
          <span class="journal-close-arrow"></span>
        </button>
        <div class="journal-scroll" id="journal-scroll"></div>
      </div>
      <div class="journal-blank-hint">点击空白处收回</div>
    </div>

    <!-- 启动遮罩 -->
    <div class="boot-veil" id="boot-veil">
      <div class="boot-tap">点击开始</div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
